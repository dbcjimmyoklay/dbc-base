<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBC 兩季同期比較</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14202e;--tx2:#5b6b7c;--bd:#dde3ea;--c25:#8a99ab;--c26:#1a6fb5;--up:#1a8f4c;--dn:#d23b3b;--hl:#eaf2fb}
@media (prefers-color-scheme:dark){:root{--bg:#000b18;--card:#001529;--tx:#f2f6fa;--tx2:#8aadcc;--bd:#0a3260;--c25:#8aa0b8;--c26:#4aa3ff;--up:#43c97a;--dn:#ff6b6b;--hl:#002a52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Microsoft JhengHei","PingFang TC",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:32px 0 10px}
.sub{color:var(--tx2);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--tx2);padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--c26);color:#fff}
.legend{display:flex;gap:14px;font-size:13px;color:var(--tx2)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--tx2);font-weight:600}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.tot td{font-weight:700;background:var(--hl)}
tr.tot td:first-child{background:var(--hl)}
tr:last-child td{border-bottom:0}
.grp{border-left:1px solid var(--bd)}
.up{color:var(--up);font-weight:600}.dn{color:var(--dn);font-weight:600}.na{color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ch{padding:12px 12px 6px}
.ch h3{margin:0 0 2px;font-size:15px}
.ch .k{font-size:13px;color:var(--tx2);margin-bottom:4px}
.ch .k b{color:var(--tx)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--tx2);font-size:10px}
.note{font-size:12.5px;color:var(--tx2);margin-top:8px}
.cell{border-radius:4px;padding:2px 6px;display:inline-block;min-width:30px}
td.lbl{color:var(--tx2);font-size:12.5px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <h1>DBC 兩季同期比較　25/26 vs 26/27</h1>
  <div class="sub" id="asof"></div>

  <div class="bar">
    <div class="seg" id="segPre">
      <button data-v="1" class="on">含 25/26 的 5/1 前先售</button>
      <button data-v="0">僅比 5/1 起</button>
    </div>
    <div class="seg" id="segMet">
      <button data-v="p" class="on">曲線看：人數</button>
      <button data-v="f">曲線看：團費</button>
    </div>
    <div class="legend"><span><i style="background:var(--c25)"></i>25/26</span><span><i style="background:var(--c26)"></i>26/27</span></div>
  </div>

  <h2>① 總覽（同一個天數比較）</h2>
  <div class="card scroll"><table id="tbl"></table></div>
  <div class="note" id="tblNote"></div>

  <h2>② 累積報名曲線（橫軸 = 開賣 5/1 後第幾天）</h2>
  <div class="grid" id="charts"></div>
  <div class="note">灰線 = 去年整季（虛線 = 今年資料日之後，看去年後面還繼續賣多少）；藍實線 = 今年；藍虛線 = 推估到 11/30（見③）；直立虛線 = 今年資料日。</div>

  <h2>③ 推估：到 <span id="endLbl"></span> 會是什麼狀況</h2>
  <div class="card scroll"><table id="proj"></table></div>
  <div class="note" id="projNote"></div>

  <h2>④ 每月報名人數</h2>
  <div class="card scroll"><table id="mon"></table></div>

  <h2>⑤ 出發月分布（今年目前 vs 去年最終）</h2>
  <div class="card scroll"><table id="dep"></table></div>
  <div class="note">「今年佔去年」= 今年目前已報名人數 ÷ 去年整季最終人數，可看各出發月目前填了多少。</div>

  <div class="note" style="margin-top:28px" id="src"></div>
</div>

  $('proj').innerHTML = `<thead><tr><th rowspan="2">類別</th>
    <th colspan="6" class="grp" style="text-align:center">人數</th><th colspan="4" class="grp" style="text-align:center">團費（萬）</th><th class="grp">去年整季</th></tr>
    <tr><th class="grp">今年目前</th><th>去年 11/30</th><th class="grp">推估A</th><th>推估B</th><th>推估平均</th><th>vs 去年</th>
    <th class="grp">今年目前</th><th>去年 11/30</th><th>推估平均</th><th>vs 去年</th><th class="grp">最終人數</th></tr></thead>
    <tbody>${rows.map(r => tr(r)).join('')}${tr(tot, 'tot')}</tbody>`;
  $('projNote').textContent = '去年 11/30 = 25/26 的 5/1 起累計（今年沒有先售，不含 5/1 前）。推估A = 去年 11/30 × 今年目前比例（整季速度）；推估B = 今年目前 + 去年第 ' + CUT + '→' + END + ' 天增量 × 近 60 天比例（近期速度）；推估平均為兩者平均，曲線圖的藍色虛線也用它。僅依去年曲線形狀外推，未考慮價格、活動與取消，請當參考區間。';
}
function pct(a, b) { if (!a) return '<span class="na">—</span>'; const v = (b - a) / a * 100; return `<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v.toFixed(0)}%</span>`; }
function avg(p, f) { return p ? fmt(Math.round(f / p)) : '<span class="na">—</span>'; }

function renderTable() {
  const rows = D.cats.map(c => {
    const a = cum('y25', c.key, CUT, incPre), b = cum('y26', c.key, CUT, true), fin = cum('y25', c.key, 9999, incPre);
    return {name: c.key, a, b, fin};
  });
  const comp = rows;
  const sum = (arr, i, j) => arr.reduce((s, r) => s + r[i][j], 0);
  const tot = {name: '合計', a: [sum(comp,'a',0), sum(comp,'a',1)], b: [sum(comp,'b',0), sum(comp,'b',1)], fin: [sum(comp,'fin',0), sum(comp,'fin',1)]};
  const tr = (r, cls) => {
    const noPrev = r.a[0] === 0;
    return `<tr class="${cls||''}"><td>${r.name}</td>
      <td class="grp">${noPrev?'<span class="na">—</span>':fmt(r.a[0])}</td><td>${fmt(r.b[0])}</td><td>${noPrev?'<span class="na">去年無</span>':pct(r.a[0], r.b[0])}</td>
      <td class="grp">${noPrev?'<span class="na">—</span>':wan(r.a[1])}</td><td>${wan(r.b[1])}</td><td>${noPrev?'<span class="na">—</span>':pct(r.a[1], r.b[1])}</td>
      <td class="grp">${avg(r.a[0], r.a[1])}</td><td>${avg(r.b[0], r.b[1])}</td>
      <td class="grp">${noPrev?'<span class="na">—</span>':fmt(r.fin[0])}</td></tr>`;
  };
  $('tbl').innerHTML = `<thead><tr><th rowspan="2">類別</th>
    <th colspan="3" class="grp" style="text-align:center">報名人數</th>
    <th colspan="3" class="grp" style="text-align:center">團費（萬）</th>
    <th colspan="2" class="grp" style="text-align:center">人均團費</th>
    <th class="grp">去年整季</th></tr>
    <tr><th class="grp">去年同期</th><th>今年</th><th>差</th><th class="grp">去年同期</th><th>今年</th><th>差</th><th class="grp">去年同期</th><th>今年</th><th class="grp">最終人數</th></tr></thead>
    <tbody>${rows.map(r => tr(r)).join('')}${tr(tot, 'tot')}</tbody>`;
  $('tblNote').textContent = incPre
    ? '去年同期 = 25/26 開賣前先售 + 5/1 起至第 ' + CUT + ' 天；今年 = 26/27 目前（5/1 才開賣，沒有先售）。'
    : '去年同期 = 25/26 的 5/1 起至第 ' + CUT + ' 天（不含先售）；今年 = 26/27 目前。';
}

function lineChart(c) {
  const W = 360, H = 190, L = 38, R = 10, T = 10, B = 24, XMAX = 330;
  const series = y => {
    const pts = []; let p = 0, f = 0;
    const days = D[y][c.key].days, ks = Object.keys(days).map(Number).sort((a, b) => a - b);
    let i = 0;
    for (let d = 0; d <= XMAX; d++) {
      while (i < ks.length && ks[i] <= d) { const k = ks[i]; if (k >= 0 || (y === 'y25' && incPre)) { p += days[k][0]; f += days[k][1]; } i++; }
      pts.push([d, metric === 'p' ? p : f]);
    }
    return pts;
  };
  const s25 = series('y25'), s26 = series('y26').filter(x => x[0] <= CUT);
  const mi = metric === 'p' ? 0 : 1, P = projFor(c.key), tgt = P.M[mi], now = P.now[mi];
  const f25 = d => cum('y25', c.key, d, false)[mi], den = f25(END) - f25(CUT);
  const sp = []; for (let d = CUT; d <= END; d += 2) sp.push([d, now + (den > 0 ? (f25(d) - f25(CUT)) / den * (tgt - now) : 0)]);
  sp.push([END, tgt]);
  const ymax = Math.max(1, s25[s25.length-1][1], s26.length ? s26[s26.length-1][1] : 0, tgt);
  const nice = v => { const m = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / m * 2) / 2 * m; };
  const YM = nice(ymax);
  const x = d => L + d / XMAX * (W - L - R), y = v => T + (1 - v / YM) * (H - T - B);
  const path = pts => pts.map((q, i) => (i ? 'L' : 'M') + x(q[0]).toFixed(1) + ' ' + y(q[1]).toFixed(1)).join('');
  const s25a = s25.filter(q => q[0] <= CUT), s25b = s25.filter(q => q[0] >= CUT);
  const yl = v => metric === 'p' ? fmt(v) : wan(v) + '萬';
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = YM * i / 4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)" stroke-width="1"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${yl(v)}</text>`; }
  const mo = [['5/1',0],['6/1',31],['7/1',61],['8/1',92],['9/1',123],['10/1',153],['11/1',184],['12/1',214],['1/1',245],['2/1',276],['3/1',304]];
  mo.forEach(([t, d]) => { g += `<text x="${x(d)}" y="${H-8}" text-anchor="middle">${t}</text>`; });
  const last = s26[s26.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}">${g}
    <path d="${path(s25b)}" fill="none" stroke="var(--c25)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${path(s25a)}" fill="none" stroke="var(--c25)" stroke-width="2"/>
    <line x1="${x(CUT)}" x2="${x(CUT)}" y1="${T}" y2="${H-B}" stroke="var(--tx2)" stroke-dasharray="2 3"/>
    <path d="${path(sp)}" fill="none" stroke="var(--c26)" stroke-width="2" stroke-dasharray="3 3" opacity=".7"/>
    <circle cx="${x(END)}" cy="${y(tgt)}" r="3" fill="none" stroke="var(--c26)" stroke-width="1.5"/>
    <path d="${path(s26)}" fill="none" stroke="var(--c26)" stroke-width="2.6"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="3.5" fill="var(--c26)"/></svg>`;
}

function renderCharts() {
  $('charts').innerHTML = D.cats.map(c => {
    const a = cum('y25', c.key, CUT, incPre), b = cum('y26', c.key, CUT, true), fin = cum('y25', c.key, 9999, incPre);
    const noPrev = a[0] === 0 && fin[0] === 0;
    const k = metric === 'p'
      ? (noPrev ? `今年 <b>${fmt(b[0])}</b> 人（去年無此項目）` : `去年同期 <b>${fmt(a[0])}</b> → 今年 <b>${fmt(b[0])}</b> 人　${pct(a[0], b[0])}`)
      : (noPrev ? `今年 <b>${wan(b[1])}</b> 萬（去年無此項目）` : `去年同期 <b>${wan(a[1])}</b> → 今年 <b>${wan(b[1])}</b> 萬　${pct(a[1], b[1])}`);
    return `<div class="card ch"><h3>${c.key}</h3><div class="k">${k}</div>${lineChart(c)}</div>`;
  }).join('');
}

const MCOLS = [['5/1前', 'pre'], ['5月', 5], ['6月', 6], ['7月', 7], ['8月', 8], ['9月', 9], ['10月', 10], ['11月', 11], ['12月', 12], ['1月', 1], ['2月', 2], ['3月', 3]];
function monthOf(y, d) { // 5/1 = day 0；以日曆月推算
  const base = y === 'y25' ? new Date(2025, 4, 1) : new Date(2026, 4, 1);
  base.setDate(base.getDate() + d); return base.getMonth() + 1;
}
function monthly(y, key) {
  const out = {}; const days = D[y][key].days;
  for (const k in days) { const d = +k; const m = d < 0 ? 'pre' : monthOf(y, d); out[m] = (out[m] || 0) + days[k][0]; }
  return out;
}
function heat(v, max) { if (!v) return '<span class="na">·</span>'; const a = Math.min(1, v / max); return `<span class="cell" style="background:rgba(26,111,181,${(0.1 + a * 0.5).toFixed(2)})">${fmt(v)}</span>`; }
function renderMonthly() {
  let max = 1; const rows = [];
  D.cats.forEach(c => { const a = monthly('y25', c.key), b = monthly('y26', c.key); rows.push([c.key, a, b]); Object.values(a).concat(Object.values(b)).forEach(v => max = Math.max(max, v)); });
  const head = `<thead><tr><th>類別</th><th></th>${MCOLS.map(m => `<th>${m[0]}</th>`).join('')}<th class="grp">合計</th></tr></thead>`;
  const body = rows.map(([k, a, b]) => {
    const ta = Object.values(a).reduce((s, v) => s + v, 0), tb = Object.values(b).reduce((s, v) => s + v, 0);
    return `<tr><td rowspan="2">${k}</td><td class="lbl">25/26</td>${MCOLS.map(m => `<td>${heat(a[m[1]], max)}</td>`).join('')}<td class="grp">${fmt(ta)}</td></tr>
      <tr><td class="lbl" style="color:var(--c26)">26/27</td>${MCOLS.map(m => `<td>${heat(b[m[1]], max)}</td>`).join('')}<td class="grp"><b>${fmt(tb)}</b></td></tr>`;
  }).join('');
  $('mon').innerHTML = head + '<tbody>' + body + '</tbody>';
}

const DCOLS = [[12, '12月'], [1, '1月'], [2, '2月'], [3, '3月']];
function renderDep() {
  const head = `<thead><tr><th>類別</th><th></th>${DCOLS.map(m => `<th>${m[1]}</th>`).join('')}<th class="grp">合計</th></tr></thead>`;
  const body = D.cats.map(c => {
    const a = D.y25[c.key].dep, b = D.y26[c.key].dep;
    const va = DCOLS.map(m => (a[m[0]] || [0])[0]), vb = DCOLS.map(m => (b[m[0]] || [0])[0]);
    const ta = va.reduce((s, v) => s + v, 0), tb = vb.reduce((s, v) => s + v, 0);
    const noPrev = ta === 0;
    return `<tr><td rowspan="3">${c.key}</td><td class="lbl">25/26 最終</td>${va.map(v => `<td>${v ? fmt(v) : '<span class="na">·</span>'}</td>`).join('')}<td class="grp">${fmt(ta)}</td></tr>
      <tr><td class="lbl" style="color:var(--c26)">26/27 目前</td>${vb.map(v => `<td><b>${v ? fmt(v) : '<span class="na">·</span>'}</b></td>`).join('')}<td class="grp"><b>${fmt(tb)}</b></td></tr>
      <tr><td class="lbl">今年佔去年</td>${va.map((v, i) => `<td>${v ? Math.round(vb[i] / v * 100) + '%' : '<span class="na">—</span>'}</td>`).join('')}<td class="grp">${noPrev ? '<span class="na">—</span>' : Math.round(tb / ta * 100) + '%'}</td></tr>`;
  }).join('');
  $('dep').innerHTML = head + '<tbody>' + body + '</tbody>';
}

function renderAll() { renderTable(); renderCharts(); renderProj(); renderMonthly(); renderDep(); }
$('endLbl').textContent = '11/30';
function bindSeg(id, fn) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    fn(b.dataset.v); renderAll();
  });
}
bindSeg('segPre', v => incPre = +v);
bindSeg('segMet', v => metric = v);
$('asof').textContent = `資料日 ${D.asof}（26/27 最後一筆報名 ${D.lastSignup}），開賣後第 ${CUT} 天　｜　純課＋團客分開計算`;
$('src').textContent = `資料來源：${D.srcPrev}、${D.srcCur}。口徑：純課 = 團號含 ZN/ZB/ZY；團客 = 25/26 團號開頭 DBC-N（野澤）、DBC-B（斑尾），26/27 開頭 S4-J-N / S4-J-B（龍平不比較）；其他團號不計。團費為各旅客列加總，未扣除後續取消。`;
renderAll();
</script>
</body>
</html>
