<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000b18">
<title>DBC</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:    #000b18;   /* 最深底色 */
  --bg1:    #001529;   /* 側欄 */
  --bg2:    #001f3d;   /* 卡片 */
  --bg3:    #002a52;   /* hover */
  --bd:     #0a3260;   /* 邊框 */
  --bd2:    #0d3d75;   /* 淺邊框 */
  --tx:     #ffffff;   /* 主文字 */
  --tx2:    #8aadcc;   /* 次文字 */
  --tx3:    #4a7299;   /* 說明文字 */
  --ac:     #1a6fb5;   /* 藍色強調 */
  --ac2:    #2489d6;   /* 亮藍 */
  --nav-w:  220px;
  --top-h:  52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; scrollbar-gutter: stable; }
body {
  background: var(--bg0);
  color: var(--tx);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════
   LOGO SVG
════════════════════════════════ */
.dbc-logo svg { width: 96px; height: auto; display: block; }

/* ════════════════════════════════
   LOGIN
════════════════════════════════ */
#login-screen {
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg0);
  position: relative; overflow: hidden;
}
#login-screen::before {
  content: '';
  position: absolute; top: -30%; left: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(ellipse, rgba(26,111,181,.12) 0%, transparent 70%);
  pointer-events: none;
}
.login-card {
  position: relative; z-index: 1;
  width: 380px; max-width: 92vw;
  padding: 48px 40px 40px;
  background: var(--bg1);
  border: 1px solid var(--bd);
  border-radius: 16px;
}
.login-logo { margin-bottom: 32px; }
.login-divider {
  height: 1px; background: var(--bd);
  margin: 28px 0;
}
.login-title { font-size: 20px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--tx2); margin-bottom: 28px; }
.g-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 20px;
  background: var(--tx); color: #1a1a1a;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 500; letter-spacing: -.1px;
  cursor: pointer; transition: opacity .15s;
}
.g-btn:hover { opacity: .9; }
.g-btn img { width: 18px; height: 18px; }

/* ════════════════════════════════
   REGISTER / PENDING
════════════════════════════════ */
.center-screen {
  min-height: 100dvh; display: none;
  align-items: center; justify-content: center;
  background: var(--bg0);
}
.center-card {
  width: 400px; max-width: 92vw;
  padding: 48px 40px;
  background: var(--bg1);
  border: 1px solid var(--bd);
  border-radius: 16px;
  text-align: center;
}
.status-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--bg2); border: 1px solid var(--bd2);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin: 0 auto 20px;
}
.center-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.center-sub { font-size: 13px; color: var(--tx2); line-height: 1.7; margin-bottom: 20px; }
.email-badge {
  display: inline-block;
  background: var(--bg2); border: 1px solid var(--bd2);
  border-radius: 6px; padding: 6px 14px;
  font-size: 12px; color: var(--ac2);
  font-family: 'SF Mono', 'Fira Code', monospace;
  margin-bottom: 24px; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.input-field {
  width: 100%; padding: 12px 16px;
  background: var(--bg0); border: 1px solid var(--bd2);
  border-radius: 10px; color: var(--tx);
  font-size: 14px; font-family: inherit;
  outline: none; transition: border-color .15s;
  margin-bottom: 14px;
}
.input-field:focus { border-color: var(--ac2); }
.input-field::placeholder { color: var(--tx3); }
.btn-primary {
  width: 100%; padding: 13px;
  background: var(--tx); color: #0a1628;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  margin-bottom: 10px;
}
.btn-primary:hover { opacity: .9; }
.btn-ghost {
  width: 100%; padding: 11px;
  background: transparent; color: var(--tx3);
  border: 1px solid var(--bd); border-radius: 10px;
  font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.btn-ghost:hover { color: var(--tx2); border-color: var(--bd2); }

/* ════════════════════════════════
   APP SHELL
════════════════════════════════ */
#app-screen { display: none; }

/* Sidebar */
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--nav-w);
  background: var(--bg1);
  border-right: 1px solid var(--bd);
  display: flex; flex-direction: column;
  z-index: 200; transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.sb-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.sb-logo { flex: 1; }
.sb-logo svg { width: 72px; height: auto; }
.sb-nav {
  flex: 1; overflow-y: auto; padding: 8px 0;
  scrollbar-width: none;
}
.sb-nav::-webkit-scrollbar { display: none; }

.nav-section-label {
  padding: 12px 16px 4px;
  font-size: 10px; font-weight: 600;
  color: var(--tx3); text-transform: uppercase; letter-spacing: 1.2px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; margin: 1px 8px;
  border-radius: 8px; cursor: pointer;
  font-size: 13.5px; font-weight: 400; color: var(--tx2);
  transition: all .15s; user-select: none;
}
.nav-item:hover { background: var(--bg3); color: var(--tx); }
.nav-item.active {
  background: rgba(26,111,181,.2);
  color: #60b3f4;
  font-weight: 500;
}
.nav-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  opacity: .7;
}
.nav-item.active .nav-icon { opacity: 1; }

/* Sub nav */
.nav-sub .nav-item {
  padding: 8px 12px 8px 20px;
  font-size: 13px; margin: 0 8px 1px;
}

/* Sidebar bottom */
.sb-bottom {
  padding: 12px; border-top: 1px solid var(--bd); flex-shrink: 0;
}
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg2); margin-bottom: 8px;
}
.user-av {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ac); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  overflow: hidden;
}
.user-av img { width: 100%; height: 100%; object-fit: cover; }
.user-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--tx3); white-space: nowrap; }
.btn-out {
  width: 100%; padding: 8px;
  background: transparent; color: var(--tx3);
  border: 1px solid var(--bd); border-radius: 7px;
  font-size: 12px; cursor: pointer; transition: all .15s;
}
.btn-out:hover { color: #f87171; border-color: #7f1d1d; }

/* Main content */
.main {
  margin-left: var(--nav-w);
  min-height: 100dvh;
  display: flex; flex-direction: column;
}
.topbar {
  height: var(--top-h); flex-shrink: 0;
  background: var(--bg0);
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-menu { display: none; background: none; border: none; color: var(--tx2); cursor: pointer; padding: 4px; }
.topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
.topbar-tag {
  font-size: 11px; color: var(--tx3);
  background: var(--bg2); border: 1px solid var(--bd);
  border-radius: 4px; padding: 3px 8px;
}
.topbar-home {
  display: none; align-items: center; gap: 5px;
  background: none; border: 1px solid var(--bd); border-radius: 6px;
  color: var(--tx2); cursor: pointer; padding: 4px 10px;
  font-size: 12px; font-family: inherit; flex-shrink: 0;
  transition: all .15s;
}
.topbar-home:hover { color: var(--tx); border-color: var(--bd2); background: var(--bg2); }

.page { flex: 1; padding: 28px 24px; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
.page-header p { font-size: 13px; color: var(--tx2); margin-top: 4px; }

/* Home grid */
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.home-card {
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-radius: 12px; padding: 20px 18px;
  cursor: pointer; transition: all .18s;
  text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 10px;
}
.home-card:hover {
  background: var(--bg3);
  border-color: var(--bd2);
  transform: translateY(-1px);
}
.home-card-icon {
  width: 36px; height: 36px; border-radius: 9px;
  background: rgba(26,111,181,.15);
  display: flex; align-items: center; justify-content: center;
}
.home-card-icon svg { width: 18px; height: 18px; }
.home-card-title { font-size: 13.5px; font-weight: 600; }
.home-card-desc { font-size: 12px; color: var(--tx3); }

/* Placeholder */
.wip {
  background: var(--bg1); border: 1px solid var(--bd);
  border-radius: 12px; padding: 60px 24px;
  text-align: center; color: var(--tx3);
}
.wip-title { font-size: 15px; font-weight: 500; color: var(--tx2); margin: 12px 0 6px; }

/* Overlay */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 199; backdrop-filter: blur(2px);
}

/* Loading */
.loading {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; height: 160px; color: var(--tx3); font-size: 13px;
}
.spin {
  width: 16px; height: 16px;
  border: 2px solid var(--bd2); border-top-color: var(--ac2);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Mobile */
@media (max-width: 768px) {
  :root { --nav-w: 220px; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,.5); }
  .overlay.show { display: block; }
  .main { margin-left: 0; }
  .topbar-menu { display: flex; align-items: center; }
  .page { padding: 20px 16px; }
  .home-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .home-card { padding: 16px 14px; }
}

/* ════════════════════════════════
   COURSE PAGE
════════════════════════════════ */
.course-page { display:flex; flex-direction:column; height:calc(100dvh - var(--top-h)); overflow:hidden; padding:0; }

/* toolbar 兩列 */
.course-toolbar {
  display:flex; flex-direction:column;
  gap:6px; padding:9px 14px 8px; flex-shrink:0;
  border-bottom:1px solid var(--bd);
}
.toolbar-row { display:flex; align-items:center; gap:4px; }
.toolbar-lbl { font-size:10px; color:var(--tx3); white-space:nowrap; margin-right:2px; letter-spacing:.5px; }

/* 地區 Tab — 明顯一些 */
.c-tab {
  padding:5px 12px; border-radius:6px;
  border:1px solid var(--bd); background:var(--bg2);
  color:var(--tx2); font-size:12.5px; font-weight:500; cursor:pointer;
  transition:all .15s; font-family:inherit; white-space:nowrap;
}
.c-tab:hover { background:var(--bg3); color:var(--tx); }
.c-tab.active { background:rgba(26,111,181,.3); color:#60b3f4; border-color:var(--ac); font-weight:600; }

/* 欄位 View — 小 chip 風格 */
.c-view {
  padding:3px 9px; border-radius:10px;
  border:1px solid transparent; background:transparent;
  color:var(--tx3); font-size:11.5px; cursor:pointer;
  transition:all .15s; font-family:inherit; white-space:nowrap;
}
.c-view:hover { background:var(--bg2); color:var(--tx2); border-color:var(--bd); }
.c-view.active { background:var(--bg3); color:var(--tx); border-color:var(--bd2); }
.c-refresh { padding:3px 8px; font-size:13px; line-height:1; margin-left:auto; }

.course-body { flex:1; overflow:auto; font-size:12px; }

/* 表頭列 — Grid，sticky top，grid-template-columns 由 JS inline 設定 */
.c-hdr-row {
  display:grid; position:-webkit-sticky; position:sticky; top:0; z-index:5;
  width:max-content; min-width:100%;
  background:var(--bg1); border-bottom:2px solid var(--bd2);
}
.c-hdr {
  padding:5px 5px;
  font-size:10.5px; font-weight:600; color:var(--tx3);
  white-space:nowrap; overflow:hidden;
  display:flex; align-items:center;
}

/* 分隔列 — 直接子元素，sticky left，iOS Safari 才可靠 */
.c-sep {
  position:-webkit-sticky; position:sticky; left:0; z-index:3;
  width:100%;
  background:#0f3060;
  color:#a8d8ff; font-weight:700; font-size:12.5px;
  padding:8px 14px;
  border-top:3px solid #2a7fc0; border-bottom:2px solid #1a5a8a;
  letter-spacing:.3px;
}

/* 標籤列 — 直接子元素，sticky left */
.c-label {
  position:-webkit-sticky; position:sticky; left:0; z-index:3;
  width:100%;
  background:#000e20; padding:4px 12px 3px;
  border-top:1px solid var(--bd);
}
.c-label.s-blue   { border-left:3px solid #2a7fc0; }
.c-label.s-brown  { border-left:3px solid #8b6050; }
.c-label.s-orange { border-left:3px solid #c47a3a; }
.c-order { font-size:10px; color:var(--tx3); font-family:monospace; margin-right:7px; }
.c-name  { font-size:12px; font-weight:500; color:var(--tx2); }

/* 資料列 — Grid，grid-template-columns 由 JS inline 設定（與表頭一致）*/
.c-data-row { display:grid; width:max-content; min-width:100%; }
.c-cell {
  padding:5px 7px; white-space:nowrap; overflow:hidden;
  border-bottom:1px solid var(--bd); background:var(--bg0); color:var(--tx);
  display:flex; align-items:center; justify-content:center;
}
.c-cell.c-left { justify-content:flex-start; }

.lv-lo { color:#e8c44a !important; font-weight:600; }
.lv-hi { color:#e87d2a !important; font-weight:600; }
.td-board { color:#36c4c4 !important; }
.td-incl  { color:#f0f060 !important; }
.td-spec  { color:#f0f060 !important; font-weight:600; }

/* ════ HOME PAGE ════ */
.home-date { text-align:center; padding:20px 0 8px; }
.home-date-main { font-size:22px; font-weight:700; color:var(--tx); }
.home-date-sub  { font-size:13px; color:var(--tx2); margin-top:3px; }

.home-section { margin:12px 16px 0; background:var(--bg1); border:1px solid var(--bd); border-radius:12px; padding:14px; }
.home-section-title { font-size:11px; font-weight:600; color:var(--tx3); letter-spacing:.8px; text-transform:uppercase; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }

.today-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--bd); }
.today-row:last-child { border-bottom:none; }
.today-row-zero { opacity:.4; }
.today-area  { font-size:13px; font-weight:600; color:var(--tx); width:30px; }
.today-total { font-size:13px; font-weight:700; color:#60b3f4; min-width:36px; }
.today-detail { display:flex; gap:5px; flex-wrap:wrap; }
.today-tag { font-size:11px; padding:2px 7px; border-radius:8px; }
.today-tag.group { background:rgba(26,111,181,.2); color:#7ec8f5; border:1px solid rgba(26,111,181,.3); }
.today-tag.pure  { background:rgba(50,180,100,.15); color:#6dddaa; border:1px solid rgba(50,180,100,.3); }
.today-zero { font-size:13px; color:var(--tx3); }

.equip-btns { display:flex; gap:8px; flex-wrap:wrap; }
.equip-btn { padding:7px 18px; border-radius:8px; border:1px solid var(--bd); background:var(--bg2); color:var(--tx2); font-size:13px; cursor:pointer; font-family:inherit; }
.equip-btn:hover { background:var(--bg3); color:var(--tx); }
.equip-detail { margin-top:10px; padding:8px 10px; background:var(--bg2); border-radius:8px; }
.equip-hotel-row { display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px; color:var(--tx2); border-bottom:1px solid var(--bd); }
.equip-hotel-row:last-child { border-bottom:none; }

.punch-btn { width:100%; padding:11px; border-radius:9px; border:1px solid var(--bd); background:var(--bg2); color:var(--tx3); font-size:13px; cursor:not-allowed; font-family:inherit; }

.ql-edit-btn { font-size:11.5px; padding:3px 10px; border-radius:6px; border:1px solid var(--bd); background:transparent; color:var(--tx3); cursor:pointer; font-family:inherit; }
.ql-edit-btn:hover { background:var(--bg2); color:var(--tx); }
.ql-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.ql-item { background:var(--bg2); border:1px solid var(--bd); border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer; transition:background .15s; }
.ql-item:hover { background:var(--bg3); }
.ql-icon { width:28px; height:28px; margin:0 auto 6px; color:#5ba3d4; }
.ql-icon svg { width:100%; height:100%; }
.ql-name { font-size:11.5px; color:var(--tx2); line-height:1.3; word-break:keep-all; }
.ql-setting-row { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid var(--bd); gap:8px; }

/* ── 入住單：旅館 Header（縮小版）── */
.ci-hotel {
  position:-webkit-sticky; position:sticky; left:0; z-index:3; width:100%;
  background:#00203d; color:#7ec8f5; font-weight:600; font-size:12px;
  padding:5px 14px 4px; border-top:2px solid #1a5a8a;
  display:flex; align-items:center; gap:8px;
}
.ci-hotel-count {
  font-size:10.5px; font-weight:400; color:var(--tx3);
  background:var(--bg3); padding:1px 7px; border-radius:8px;
}

/* ── 銷量分析 ── */
.sa-page { padding:14px 16px 32px; max-width:1280px; margin:0 auto; }
.sa-head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.sa-head h1 { font-size:20px; font-weight:700; letter-spacing:-.3px; }
.sa-head .sa-upd { font-size:11px; color:var(--tx3); font-family:monospace; background:var(--bg1); border:1px solid var(--bd); border-radius:14px; padding:3px 11px; }

.sa-sec { font-size:10.5px; font-weight:600; color:var(--tx3); text-transform:uppercase; letter-spacing:1.2px; margin:20px 0 10px; display:flex; align-items:center; gap:8px; }
.sa-sec::after { content:''; flex:1; height:1px; background:var(--bd); }

.sa-card { background:var(--bg1); border:1px solid var(--bd); border-radius:10px; padding:14px; margin-bottom:10px; }
.sa-card-ti { font-size:12px; font-weight:500; margin-bottom:12px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.sa-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.sa-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
.sa-tab { padding:3px 11px; border-radius:5px; font-size:11px; cursor:pointer; border:1px solid transparent; transition:all .15s; color:var(--tx3); background:transparent; font-family:inherit; }
.sa-tab.active { background:var(--ac); border-color:var(--ac); color:#fff; font-weight:500; }
.sa-tab:hover:not(.active) { border-color:var(--bd); color:var(--tx2); }

/* 總覽 KPI bar */
.sa-overview { display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center; }
.sa-ov-big { text-align:center; padding-right:16px; border-right:1px solid var(--bd); }
.sa-ov-big .v { font-size:42px; font-weight:700; font-family:monospace; line-height:1; }
.sa-ov-big .l { font-size:11px; color:var(--tx3); margin-top:4px; }
.sa-ov-rev { text-align:center; padding-left:16px; border-left:1px solid var(--bd); }
.sa-ov-rev .v { font-size:28px; font-weight:700; font-family:monospace; color:#10b981; line-height:1; }
.sa-ov-rev .l { font-size:11px; color:var(--tx3); margin-top:4px; }

let currentUser       = null;
let idToken           = null;
let needsTokenRefresh = false; // 從 cache 啟動時 token 可能過期

function svgIcon(path) {
  return `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${path}</svg>`;
}

/* ── 登入 ── */
function signIn() {
  // 登入時才初始化 GSI（只在 login screen 呼叫）
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false });
  google.accounts.id.prompt(n => {
    if (n.isNotDisplayed() || n.isSkippedMoment()) {
      const btn = document.querySelector('.g-btn');
      if (btn) google.accounts.id.renderButton(btn.parentNode, { theme: 'outline', size: 'large' });
    }
  });
}

function onCredential(resp) {
  idToken = resp.credential;
  if (currentUser) {
    // 靜默刷新 token 成功 → 存好、如果課程頁在等待就立刻重試
    needsTokenRefresh = false;
    _saveSess(currentUser, idToken);
    const cb = document.getElementById('course-body');
    if (cb && cb.dataset.waiting === '1') {
      cb.dataset.waiting = '';
      loadCourse();
    }
    return;
  }
  needsTokenRefresh = false;
  callAPI({token: idToken, action: 'check'});
}

async function callAPI(params) {
  try {
    const qs  = new URLSearchParams(params);
    const res = await fetch(`${API}?${qs}`, { redirect: 'follow' });
    handleResult(await res.json());
  } catch(e) { alert('連線失敗，請稍後再試'); }
}

/* 統一 API 呼叫：登入後優先用 userKey（永久有效），fallback 到 token */
function apiUrl(action, extras) {
  const params = new URLSearchParams({ action, ...(extras || {}) });
  if (currentUser?.userKey && currentUser?.email) {
    params.set('email',   currentUser.email);
    params.set('userKey', currentUser.userKey);
  } else if (idToken) {
    params.set('token', idToken);
  }
  return `${API}?${params}`;
}

function handleResult(d) {
  hide('login-screen'); hide('register-screen'); hide('pending-screen'); hide('app-screen');
  if (d.status === 'approved') {
    currentUser = d;
    _saveSess(d, idToken);
    showApp();
  }
  else if (d.status === 'new_user') { showRegister(d.email); }
  else if (d.status === 'pending')  { showPending(d.email); }
  else if (d.status === 'disabled') { alert('此帳號已停用，請聯絡管理員。'); show('login-screen', 'flex'); }
  else { alert('錯誤：' + (d.message||'請重試')); show('login-screen', 'flex'); }
}

function showRegister(email) {
  show('register-screen', 'flex');
  document.getElementById('reg-email').textContent = email;
}
async function submitRegister() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { alert('請填寫姓名'); return; }
  await callAPI({ token: idToken, name, action: 'register' });
}

function showPending(email) {
  show('pending-screen', 'flex');
  document.getElementById('pend-email').textContent = email;
}

/* ── 主畫面 ── */
function showApp() {
  show('app-screen');
  const u = currentUser;
  document.getElementById('uname').textContent  = u.name || u.email;
  document.getElementById('urole').textContent  = u.role;
  document.getElementById('user-tag').textContent = u.role;
  const av = document.getElementById('uav');
  av.textContent = (u.name || u.email)[0].toUpperCase();
  buildNav(u.pages || []);
  showHome();
}

function buildNav(pages) {
  const menu = document.getElementById('nav-menu');
  let html = `<div class="nav-item active" id="nav-home" onclick="showHome()">
    ${svgIcon('<path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>')}
    首頁</div>`;

  const secs = {};
  pages.forEach(p => {
    const s = PAGES[p]?.section || '其他';
    if (!secs[s]) secs[s] = [];
    secs[s].push(p);
  });

  /* 依 SECTION_ORDER 排序 */
  const orderedSecs = [];
  SECTION_ORDER.forEach(s => { if (secs[s]) orderedSecs.push([s, secs[s]]); });
  Object.entries(secs).forEach(([s, ps]) => {
    if (!SECTION_ORDER.includes(s)) orderedSecs.push([s, ps]);
  });

  orderedSecs.forEach(([sec, ps]) => {
    html += `<div class="nav-section-label">${sec}</div>`;
    ps.forEach(p => {
      const def = PAGES[p] || {};
      html += `<div class="nav-item" data-page="${p}" onclick="go('${p}')">${svgIcon(def.icon||'')} ${p}</div>`;
    });
  });
  menu.innerHTML = html;
}

function go(page) {
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-page]').forEach(e => {
    if (e.dataset.page === page) e.classList.add('active');
  });
  document.getElementById('page-title').textContent = page;
  const btnHome = document.getElementById('btn-home');
  if (btnHome) btnHome.style.display = 'flex';

async function _loadTodaySummary() {
  const el = document.getElementById('today-summary');
  if (!el) return;
  try {
    const ck = localStorage.getItem('dbc_today');
    const ts = parseInt(localStorage.getItem('dbc_today_ts')||'0');
    if (ck && Date.now()-ts < 5*60*1000) { _renderTodaySummary(JSON.parse(ck), el); return; }
  } catch(e) {}
  try {
    const res  = await fetch(apiUrl('getToday'), {redirect:'follow'});
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    localStorage.setItem('dbc_today', JSON.stringify(data));
    localStorage.setItem('dbc_today_ts', String(Date.now()));
    _renderTodaySummary(data, el);
  } catch(e) {
    if (el) el.innerHTML = `<div style="color:var(--tx3);font-size:12px">無法載入（${e.message}）</div>`;
  }
}

function _renderTodaySummary(data, el) {
  const c = data.counts || {};
  const areas = [
    { name:'野澤', g:c.ng||0, p:c.np||0 },
    { name:'斑尾', g:c.mg||0, p:c.mp||0 },
    { name:'龍平', g:c.yn||0, p:c.yp||0 },
    { name:'湯澤', g:0,       p:c.uz||0  },
  ];
  el.innerHTML = areas.map(a => {
    const total = a.g + a.p;
    return `<div class="today-row${total===0?' today-row-zero':''}">
      <span class="today-area">${a.name}</span>
      <span class="today-total">${total}人</span>
      <span class="today-detail">
        ${a.g>0?`<span class="today-tag group">團客 ${a.g}</span>`:''}
        ${a.p>0?`<span class="today-tag pure">純課 ${a.p}</span>`:''}
        ${total===0?'<span class="today-zero">－</span>':''}
      </span>
    </div>`;
  }).join('');
}

async function _loadEquip(area, el) {
  try {
    /* 重用入住單快取（同一份資料） */
    const ck = localStorage.getItem('dbc_ci_' + area);
    const ts = parseInt(localStorage.getItem('dbc_ci_' + area + '_ts') || '0');
    let rows;
    if (ck && Date.now() - ts < CI_CACHE_TTL) {
      rows = JSON.parse(ck);
    } else {
      const res  = await fetch(apiUrl('getCheckin', {area}), {redirect:'follow'});
      const data = await res.json();
      if (data.status !== 'ok') throw new Error(data.message || '伺服器錯誤');
      rows = data.rows || [];
      try {
        localStorage.setItem('dbc_ci_' + area, JSON.stringify(rows));
        localStorage.setItem('dbc_ci_' + area + '_ts', String(Date.now()));
      } catch(e2) {}
    }

    /* 今日日期字串 YY/MM/DD */
    const t = new Date();
    const today = `${String(t.getFullYear()).slice(2)}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;

    /* 計算每位旅客退房日期，統計今日退房人數
       CHECKIN_COLS: 1=出發日期, 2=泊數, 4=訂編 */
    let totalToday = 0;
    for (const row of rows) {
      if (!Array.isArray(row)) continue;
      if (ciIsSep(row)) continue;
      const orderNo = String(row[4] || '').trim();
      if (!orderNo) continue;
      const co = coComputeCheckout(String(row[1] || ''), String(row[2] || ''));
      if (co && co.dateStr === today) totalToday++;
    }

    if (!totalToday) {
      el.innerHTML = `<div style="color:var(--tx3);font-size:12px;padding:4px 0">今日無退房旅客</div>`;
      return;
    }
    el.innerHTML = `
      <div class="equip-hotel-row">
        <span style="font-weight:600">退房人數</span>
        <span style="color:#60b3f4;font-weight:700">${totalToday}人</span>
      </div>
      <div class="equip-hotel-row" style="border-bottom:none">
        <span style="color:var(--tx3);font-size:12px">下山巴士 ${totalToday}張&ensp;／&ensp;新幹線 ${totalToday}張</span>
      </div>`;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--tx3);font-size:12px;padding:4px 0">載入失敗（${e.message}）</div>`;
  }
}

function _qlSettingsList(all) {
  return all.map(p => {
    const on = _qlDraft.includes(p);
    return `<div class="ql-setting-row">
      <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">
        <input type="checkbox" ${on?'checked':''} onchange="_qlToggle('${p}',this.checked)" style="width:16px;height:16px">

function _qlToggle(p, on) {
  if (!_qlDraft) return;
  if (on && !_qlDraft.includes(p)) _qlDraft.push(p);
  else if (!on) _qlDraft = _qlDraft.filter(x=>x!==p);
}
function _qlMove(p, dir) {
  if (!_qlDraft) return;
  const i = _qlDraft.indexOf(p);
  if (i<0) return;
  const j = i+dir;
  if (j<0||j>=_qlDraft.length) return;
  [_qlDraft[i],_qlDraft[j]]=[_qlDraft[j],_qlDraft[i]];
  const list = document.getElementById('ql-list');
  if (list) list.innerHTML = _qlSettingsList(currentUser?.pages||[]);
}
function _saveQLSettings() {
  if (_qlDraft) _saveQL(_qlDraft);
  _qlDraft = null;
  document.getElementById('ql-modal')?.remove();
  const g = document.getElementById('ql-grid');
  if (g) g.innerHTML = _renderQLGrid();
}

const _SK = 'dbc_u2', _TK = 'dbc_t2', _TSK = 'dbc_ts2';
const _TOKEN_FRESH = 55 * 60 * 1000; // token 55 分鐘內視為有效

function _saveSess(u, t) {
  try { localStorage.setItem(_SK, JSON.stringify(u)); localStorage.setItem(_TK, t); localStorage.setItem(_TSK, String(Date.now())); } catch(e) {}
}
function _loadSess() {
  try {
    const u = JSON.parse(localStorage.getItem(_SK) || 'null');
    const t = localStorage.getItem(_TK) || '';
    if (u?.status === 'approved' && t) return { user: u, token: t };
  } catch(e) {}
  return null;
}
function _isTokenFresh() {
  try { return Date.now() - parseInt(localStorage.getItem(_TSK) || '0') < _TOKEN_FRESH; } catch(e) { return false; }
}
function _clearSess() {
  try { [_SK, _TK, _TSK].forEach(k => localStorage.removeItem(k)); } catch(e) {}
}

window.onload = () => {
  /* Service Worker */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

  /* 有快取 session → 直接顯示 app，完全不初始化 GSI（避免觸發 FedCM 提示）*/
  const sess = _loadSess();
  if (sess) {
    currentUser       = sess.user;
    idToken           = sess.token;
    hide('login-screen');
    showApp();
    // 不呼叫 initialize() / prompt()，不會有任何 Google 登入提示
  } else {
    show('login-screen', 'flex');
    // 沒有 session 才初始化 GSI + 顯示登入
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true });
    google.accounts.id.prompt();
  }
};

};

const COURSE_CACHE_TTL = 15 * 60 * 1000;

let cRawRows = null;
let cArea    = '全部';
let cView    = '完整';

function cIsSep(row) {
  return Array.isArray(row) && row.length >= 3 && WEEKDAY_SET.has(String(row[2]));
}

function cFilter(rows, area) {
  if (area === '全部') return rows.filter(r => r && !cIsSep(r) && !r.every(c => !c));
  return rows.filter(row => {
    if (!row || cIsSep(row) || row.every(c => !c)) return false;
    const i1 = String(row[CI['項目1']] ?? '');
    if (area === '斑尾') return i1.includes('斑尾');
    if (area === '龍平') return i1.includes('龍平');
    if (area === '湯澤') return i1 === '湯澤純課';
    return !i1.includes('斑尾') && !i1.includes('龍平') && i1 !== '湯澤純課';
  });
}

function cHotelRank(v) {
  if (!v) return 997;
  for (let i = 0; i < HOTEL_ORDER.length; i++) if (v.includes(HOTEL_ORDER[i])) return i;
  return v.includes('野澤') ? 998 : 997;
}

function cSort(rows, area) {
  const copy = [...rows];
  if (area === '全部') return copy; // 全部：保持原始順序
  if (area !== '野澤') {
    return copy.sort((a,b) => String(a[CI['訂編']]??'').localeCompare(String(b[CI['訂編']]??'')));
  }
  return copy.sort((a,b) => {
    const hr = cHotelRank(String(a[CI['項目']]??'')) - cHotelRank(String(b[CI['項目']]??''));
    if (hr) return hr;
    const pr = (parseInt(a[CI['配房序']])||0) - (parseInt(b[CI['配房序']])||0);
    if (pr) return pr;
    return String(a[CI['訂編']]??'').localeCompare(String(b[CI['訂編']]??''));
  });
}

function cAreaColor(i1) {
  if (i1.includes('斑尾')) return 's-blue';
  if (i1.includes('龍平')) return 's-brown';
  if (i1 === '湯澤純課')   return 's-orange';
  return '';
}

      return;

  /* 直接嘗試抓取，token 過期時顯示重新登入按鈕 */
  try {
    const res  = await fetch(apiUrl('getCourse'), {redirect:'follow'});

    if (data.status !== 'ok') {
      if (data.message?.includes('Token') || data.message?.includes('未授權')) {
        const body = document.getElementById('course-body');
        if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3);line-height:2.4">
          登入已過期<br>
          <button onclick="signOut()" style="margin-top:8px;padding:8px 22px;background:var(--ac);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">重新登入</button>
        </div>`;
        return;
      }
      throw new Error(data.message || '伺服器錯誤');
    }
    cRawRows = data.rows || [];
    try {
      localStorage.setItem(COURSE_CACHE_KEY, JSON.stringify(cRawRows));
      localStorage.setItem(COURSE_CACHE_KEY + '_ts', String(Date.now()));
    } catch(e) {}
    renderCTable();
  } catch(e) {
    /* 抓取失敗仍嘗試顯示舊快取 */
    try {
      const stale = localStorage.getItem(COURSE_CACHE_KEY);
      if (stale) { cRawRows = JSON.parse(stale); renderCTable(); return; }
    } catch(e2) {}
    const body = document.getElementById('course-body');
    if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">載入失敗：${e.message}</div>`;
  }
}

async function refreshCourse() {
  cRawRows = null;
  try { localStorage.removeItem(COURSE_CACHE_KEY); localStorage.removeItem(COURSE_CACHE_KEY + '_ts'); } catch(e) {}
  const body = document.getElementById('course-body');
  if (body) body.innerHTML = '<div class="loading"><div class="spin"></div> 載入中</div>';
  await loadCourse();
}

function switchCArea(area) {
  cArea = area;
  document.querySelectorAll('.c-tab').forEach(b => b.classList.toggle('active', b.dataset.area === area));
  renderCTable();
}

function switchCView(view) {
  cView = view;
  document.querySelectorAll('.c-view[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderCTable();
}

function renderCTable() {
  const body = document.getElementById('course-body');
  if (!body || !cRawRows) return;

  const colIdxs = COURSE_VCOLS[cView];

  /* 建立日期分組 */
  const groups = [];
  let cur = null;
  for (const row of cRawRows) {
    if (!Array.isArray(row) || row.every(c => !c)) continue;
    if (String(row[0]) === '編號') continue;
    if (cIsSep(row)) { cur = {sep: row, rows: []}; groups.push(cur); }
    else if (cur) cur.rows.push(row);
  }

  /* 表頭列 + 資料列共用相同的 grid-template-columns → 欄寬完全對齊 */
  const gridCols = colIdxs.map(ci => C_META[ci][1] + 'px').join(' ');
  let html = `<div class="c-hdr-row" style="grid-template-columns:${gridCols}">`;
  colIdxs.forEach(ci => {
    const [name, , align] = C_META[ci];
    html += `<div class="c-hdr" style="justify-content:${align==='left'?'flex-start':'center'}">${name}</div>`;
  });
  html += '</div>';

  let total = 0;
  for (const grp of groups) {
    const filtered = cFilter(grp.rows, cArea);
    const sorted   = cSort(filtered, cArea);
    if (!sorted.length) continue;
    total += sorted.length;

    /* 分隔列（直接子元素，sticky left） */
    const dateStr = String(grp.sep[1] ?? '');
    const wday    = String(grp.sep[2] ?? '');
    const counts  = cArea === '全部'
      ? [grp.sep[3],grp.sep[4],grp.sep[5],grp.sep[6]].filter(Boolean).join(' | ')
      : `${cArea} ${sorted.length}人`;
    html += `<div class="c-sep">${dateStr}（${wday}） &nbsp; ${counts}</div>`;

    /* 每個旅客：標籤列（直接子元素，sticky left）+ 資料列（flex row） */
    for (const row of sorted) {
      const orderNo = String(row[CI['訂編']]     ?? '');
      const name    = String(row[CI['中文姓名']] ?? '');
      const i1      = String(row[CI['項目1']]    ?? '');
      const sc      = cAreaColor(i1);

      html += `<div class="c-label${sc?' '+sc:''}"><span class="c-order">${orderNo}</span><span class="c-name">${name}</span></div>`;
      html += `<div class="c-data-row" style="grid-template-columns:${gridCols}">`;
      colIdxs.forEach(ci => {
        const val = String(row[ci] ?? '');
        const [, , align] = C_META[ci];
        let cls = 'c-cell' + (align === 'left' ? ' c-left' : '');
        if (ci === CI['Lv']) {
          const lv = val.toLowerCase();
          if (lv==='lv1'||lv==='lv2') cls += ' lv-lo';
          else if (lv==='lv3'||lv==='lv4'||lv==='lv5') cls += ' lv-hi';
        }
        if (ci===CI['類別'] && val==='雙板') cls += ' td-board';
        if (ci===CI['天數'] && val.includes('含')) cls += ' td-incl';
        if (ci===CI['註記'] && val==='專屬')  cls += ' td-spec';
        html += `<div class="${cls}">${val}</div>`;
      });
      html += '</div>';
    }
  }

  if (!total) html += `<div class="c-label" style="padding:32px;color:var(--tx3)">此期間無資料</div>`;
  body.innerHTML = html;
}

/* ════════════════════════════════
   CHECKIN PAGE（入住單）
════════════════════════════════ */
const CI_META = {
  1: ['出發日期', 66,'center'],
  2: ['泊數',    38,'center'],
  3: ['天數',    38,'center'],
  6: ['英文姓名',100,'left'],
  7: ['性別',    38,'center'],
  8: ['年齡',    38,'center'],
 13: ['入住備註',120,'left'],
};
const CI_COLS = [1,2,3,6,7,8,13]; // 房號/房型→sub-header，序號不顯示
const CI_CACHE_TTL = 15 * 60 * 1000;
const CI_AREA_NAME = { nozawa:'野澤', madarao:'斑尾', yongpyong:'龍平' };

let ciRawRows = {};
let ciCurArea = 'nozawa';
let ciCurDate = '';

function ciIsSep(row) {
  if (!Array.isArray(row) || row.length < 2) return false;
  // 新格式：col0=空, col1=日期, col2=曜日
  if (!String(row[0]).trim() && row.length >= 3 && WEEKDAY_SET.has(String(row[2]))) return true;
  // 舊格式（sheet 尚未更新前）：col0=日期, col1=曜日
  if (String(row[0]).trim() && WEEKDAY_SET.has(String(row[1]))) return true;
  return false;
}

function renderCheckin(area) {
  ciCurArea = area;
  const pc = document.getElementById('page-content');
  pc.className = 'course-page';
  const aName = CI_AREA_NAME[area] || area;
  pc.innerHTML = `
    <div class="course-toolbar">
      <div class="toolbar-row">
        <span class="toolbar-lbl">日期</span>
        <select id="ci-date-sel" onchange="ciFilterDate(this.value)"
          style="padding:4px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);font-size:12px;">
          <option value="">全部日期</option>
        </select>
        <button class="c-tab" onclick="ciSetToday()" style="padding:4px 12px;font-size:12px">今天</button>
        <button class="c-view c-refresh" onclick="refreshCheckin()" style="margin-left:auto">↺</button>
      </div>
    </div>
    <div class="course-body" id="ci-body">
      <div class="loading"><div class="spin"></div> 載入中</div>
    </div>`;
  if (ciRawRows[area]) renderCITable();
  else loadCheckin(area);
}

function ciFilterDate(date) {
  ciCurDate = date;
  renderCITable();
}

function ciSetToday() {
  const t = new Date();
  const mm = String(t.getMonth()+1).padStart(2,'0');
  const dd = String(t.getDate()).padStart(2,'0');
  const yy = String(t.getFullYear()).slice(2);
  const today = `${yy}/${mm}/${dd}`;
  const sel = document.getElementById('ci-date-sel');
  if (!sel) return;
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === today) {
      sel.value = today; ciCurDate = today; renderCITable(); return;
    }
  }
}

async function loadCheckin(area) {
  const body = document.getElementById('ci-body');
  try {
    const ck = localStorage.getItem('dbc_ci_' + area);
    const ts = parseInt(localStorage.getItem('dbc_ci_' + area + '_ts') || '0');
    if (ck && Date.now() - ts < CI_CACHE_TTL) {
      ciRawRows[area] = JSON.parse(ck); renderCITable(); return;
    }
  } catch(e) {}
  try {
    const res  = await fetch(apiUrl('getCheckin', {area}), {redirect:'follow'});
    const data = await res.json();
    if (data.status !== 'ok') {
      if (data.message?.includes('Token') || data.message?.includes('未授權')) {
        if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3);line-height:2.4">登入已過期<br>
          <button onclick="signOut()" style="margin-top:8px;padding:8px 22px;background:var(--ac);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">重新登入</button></div>`;
        return;
      }
      throw new Error(data.message || '伺服器錯誤');
    }
    ciRawRows[area] = data.rows || [];
    try {
      localStorage.setItem('dbc_ci_' + area, JSON.stringify(ciRawRows[area]));
      localStorage.setItem('dbc_ci_' + area + '_ts', String(Date.now()));
    } catch(e) {}
    renderCITable();
  } catch(e) {
    try {
      const stale = localStorage.getItem('dbc_ci_' + ciCurArea);
      if (stale) { ciRawRows[ciCurArea] = JSON.parse(stale); renderCITable(); return; }
    } catch(e2) {}
    if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">載入失敗：${e.message}</div>`;
  }
}

async function refreshCheckin() {
  try { localStorage.removeItem('dbc_ci_'+ciCurArea); localStorage.removeItem('dbc_ci_'+ciCurArea+'_ts'); } catch(e) {}
  delete ciRawRows[ciCurArea];
  renderCheckin(ciCurArea);
}

function renderCITable() {
  const body = document.getElementById('ci-body');
  if (!body) return;
  const rows = ciRawRows[ciCurArea];
  if (!rows) return;

  /* 建立 日期 → 旅館 → 房號 的三層分組（保留 Sheet 行順序）*/
  const allDates = [];
  // groups[date] = { hotelOrder:[], hotels:{ hotel:{ roomOrder:[], rooms:{room:[rows]} } } }
  const groups = {};
  let curDate = '';

  for (const row of rows) {
    if (!Array.isArray(row) || row.every(c => !c)) continue;
    if (ciIsSep(row)) {
      const isNew = !String(row[0]).trim();
      curDate = isNew ? String(row[1] || '') : String(row[0] || '');
      if (!allDates.includes(curDate)) allDates.push(curDate);
      if (!groups[curDate]) groups[curDate] = { hotelOrder:[], hotels:{} };
      continue;
    }
    if (!curDate) continue;
    if (ciCurDate && curDate !== ciCurDate) continue;
    const hotel  = String(row[0] || ''); if (!hotel) continue;
    const roomNo = String(row[9] || '');

    const grp = groups[curDate];
    if (!grp.hotels[hotel]) {
      grp.hotelOrder.push(hotel);
      grp.hotels[hotel] = { roomOrder:[], rooms:{} };
    }
    const htl = grp.hotels[hotel];
    if (!htl.rooms[roomNo]) {
      htl.roomOrder.push(roomNo);
      htl.rooms[roomNo] = [];
    }
    htl.rooms[roomNo].push(row);
  }

  /* 更新日期選單 */
  const sel = document.getElementById('ci-date-sel');
  if (sel) {
    sel.innerHTML = '<option value="">全部日期</option>' +
      allDates.map(d => `<option value="${d}"${d===ciCurDate?' selected':''}>${d}</option>`).join('');
  }

  const gridCols = CI_COLS.map(ci => CI_META[ci][1] + 'px').join(' ');
  let html = `<div class="c-hdr-row" style="grid-template-columns:${gridCols}">`;
  CI_COLS.forEach(ci => {
    const [name,,align] = CI_META[ci];
    html += `<div class="c-hdr" style="justify-content:${align==='left'?'flex-start':'center'}">${name}</div>`;
  });
  html += '</div>';

  const datesToShow = ciCurDate ? [ciCurDate] : allDates;
  let total = 0;

  for (const date of datesToShow) {
    const grp = groups[date]; if (!grp) continue;
    /* 分隔列 */
    const sepRow = rows.find(r => ciIsSep(r) && (!String(r[0]).trim() ? String(r[1]) : String(r[0])) === date);
    const wday   = sepRow ? String(!String(sepRow[0]).trim() ? sepRow[2] : sepRow[1]) : '';
    const htlSummary = grp.hotelOrder.map(h => {
      const cnt = grp.hotels[h].roomOrder.reduce((s,r) => s + grp.hotels[h].rooms[r].length, 0);
      return `${h} ${cnt}`;
    }).join(' ｜ ');
    html += `<div class="c-sep">${date}（${wday}）&nbsp;<span style="font-weight:400;font-size:11px;color:var(--tx2)">${htlSummary}</span></div>`;

    for (const hotel of grp.hotelOrder) {  // 照 Sheet 旅館出現順序
      const htl = grp.hotels[hotel];
      const htlCount = htl.roomOrder.reduce((s,r) => s + htl.rooms[r].length, 0);
      html += `<div class="ci-hotel"><span>${hotel}</span><span class="ci-hotel-count">${htlCount}人</span></div>`;

      for (const room of htl.roomOrder) {  // 照 Sheet 房號出現順序
        const roomRows = htl.rooms[room];
        const roomType = String(roomRows[0][10] || '');
        if (!roomType) {
          html += `<div class="ci-room pending">▎ 待安排</div>`;
        } else {
          html += `<div class="ci-room">▎ ${roomType}</div>`;
        }
        for (const row of roomRows) {
          const orderNo = String(row[4] || '');
          const name    = String(row[5] || '');
          html += `<div class="c-label"><span class="c-order">${orderNo}</span><span class="c-name">${name}</span></div>`;
          html += `<div class="c-data-row" style="grid-template-columns:${gridCols}">`;
          CI_COLS.forEach(ci => {
            const val   = String(row[ci] ?? '');
            const [,,align] = CI_META[ci];
            html += `<div class="c-cell${align==='left'?' c-left':''}">${val}</div>`;
          });
          html += '</div>';
          total++;
        }
      }
    }
  }
  if (!total) html += `<div class="c-label" style="padding:32px;color:var(--tx3);text-align:center">此期間無資料</div>`;
  body.innerHTML = html;
}

/* ════════════════════════════════
   CHECKOUT PAGE（送客單）
════════════════════════════════ */
/* 送客單使用 CHECKIN_COLS 欄位索引（與入住單共用同一份資料）：
   0=項目  1=出發日期  2=泊數  3=天數  4=訂編(label)  5=中文姓名(label)
   6=英文姓名  7=性別  8=年齡  ...  13=入住備註  14=退房備註 */
const CO_META = {
  1: ['出發日期', 66,'center'],
  2: ['泊數',    38,'center'],
  3: ['天數',    38,'center'],
  6: ['英文姓名',100,'left'],
  7: ['性別',    38,'center'],
  8: ['年齡',    38,'center'],
 14: ['退房備註',120,'left'],
};
const CO_COLS = [1, 2, 3, 6, 7, 8, 14];
const CO_CACHE_TTL  = 15 * 60 * 1000;
const CO_AREA_NAME  = { nozawa:'野澤', madarao:'斑尾', yongpyong:'龍平' };

let coRawRows = {};
let coCurArea = 'nozawa';
let coCurDate = '';

function coIsSep(row) {
  if (!Array.isArray(row) || row.length < 2) return false;
  if (!String(row[0]).trim() && row.length >= 3 && WEEKDAY_SET.has(String(row[2]))) return true;
  if (String(row[0]).trim()  && WEEKDAY_SET.has(String(row[1]))) return true;

}

function renderCheckout(area) {

        <select id="co-date-sel" onchange="coFilterDate(this.value)"
          style="padding:4px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);font-size:12px;">
          <option value="">全部日期</option>
        </select>
        <button class="c-tab" onclick="coSetToday()" style="padding:4px 12px;font-size:12px">今天</button>
        <button class="c-view c-refresh" onclick="refreshCheckout()" style="margin-left:auto">↺</button>
      </div>
    </div>
    <div class="course-body" id="co-body">
      <div class="loading"><div class="spin"></div> 載入中</div>
    </div>`;
  if (coRawRows[area]) renderCOTable();
  else loadCheckout(area);
}

function coFilterDate(date) {
  coCurDate = date;
  renderCOTable();
}

function coSetToday() {
  const t  = new Date();
  const mm = String(t.getMonth()+1).padStart(2,'0');
  const dd = String(t.getDate()).padStart(2,'0');
  const yy = String(t.getFullYear()).slice(2);
  const today = `${yy}/${mm}/${dd}`;
  const sel   = document.getElementById('co-date-sel');
  if (!sel) return;
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === today) {
      sel.value = today; coCurDate = today; renderCOTable(); return;
    }
  }
}

/* 送客單直接重用入住單資料（同一份 getCheckin cache） */
async function loadCheckout(area) {
  const body = document.getElementById('co-body');
  // 先看入住單快取
  try {
    const ck = localStorage.getItem('dbc_ci_' + area);
    const ts = parseInt(localStorage.getItem('dbc_ci_' + area + '_ts') || '0');
    if (ck && Date.now() - ts < CI_CACHE_TTL) {
      coRawRows[area] = JSON.parse(ck); renderCOTable(); return;
    }
  } catch(e) {}
  // 抓取（呼叫 getCheckin，同一支 API）
  try {
    const res  = await fetch(apiUrl('getCheckin', {area}), {redirect:'follow'});
    const data = await res.json();
    if (data.status !== 'ok') {
      if (data.message?.includes('Token') || data.message?.includes('未授權')) {
        if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3);line-height:2.4">登入已過期<br>
          <button onclick="signOut()" style="margin-top:8px;padding:8px 22px;background:var(--ac);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">重新登入</button></div>`;
        return;
      }
      throw new Error(data.message || '伺服器錯誤');
    }
    coRawRows[area] = data.rows || [];
    ciRawRows[area] = coRawRows[area];   // 同步入住單快取
    try {
      localStorage.setItem('dbc_ci_' + area, JSON.stringify(coRawRows[area]));
      localStorage.setItem('dbc_ci_' + area + '_ts', String(Date.now()));
    } catch(e) {}
    renderCOTable();
  } catch(e) {
    try {
      const stale = localStorage.getItem('dbc_ci_' + coCurArea);
      if (stale) { coRawRows[coCurArea] = JSON.parse(stale); renderCOTable(); return; }
    } catch(e2) {}
    if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">載入失敗：${e.message}</div>`;
  }
}

async function refreshCheckout() {
  try {
    localStorage.removeItem('dbc_ci_'+coCurArea);
    localStorage.removeItem('dbc_ci_'+coCurArea+'_ts');
  } catch(e) {}
  delete coRawRows[coCurArea];
  delete ciRawRows[coCurArea];
  renderCheckout(coCurArea);
}

/* 計算退房日期：出發日期(YY/MM/DD) + 泊數 */
function coComputeCheckout(departStr, nightsStr) {
  const nights = parseInt(nightsStr);
  if (!nights || isNaN(nights)) return null;
  const p = String(departStr).split('/');
  if (p.length !== 3) return null;
  const d = new Date(2000 + parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + nights);
  const WDAY = ['日','一','二','三','四','五','六'];
  return {
    dateStr: `${String(d.getFullYear()).slice(2)}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
    wday: WDAY[d.getDay()],
  };
}

function renderCOTable() {
  const body = document.getElementById('co-body');
  if (!body) return;
  /* 送客單資料來源 = 入住單（同一份），退房日期由 出發日期+泊數 計算 */
  const rows = coRawRows[coCurArea] || ciRawRows[coCurArea];
  if (!rows) return;

  const allDates = [];
  const groups   = {};   // {checkoutDate: {wday, rows:[]}}

  for (const row of rows) {
    if (!Array.isArray(row) || row.every(c => !c)) continue;
    if (ciIsSep(row)) continue;                         // 跳過入住單分隔列
    const departStr = String(row[1] || '').trim();      // 出發日期
    const nightsStr = String(row[2] || '').trim();      // 泊數
    const orderNo   = String(row[4] || '').trim();      // 訂編
    if (!departStr || !nightsStr || !orderNo) continue;

    const co = coComputeCheckout(departStr, nightsStr);
    if (!co) continue;

    if (!groups[co.dateStr]) {
      allDates.push(co.dateStr);
      groups[co.dateStr] = { wday: co.wday, rows: [] };
    }
    groups[co.dateStr].rows.push(row);
  }

  allDates.sort();   // YY/MM/DD 可直接字串排序

  /* 更新日期選單 */
  const sel = document.getElementById('co-date-sel');
  if (sel) {
    sel.innerHTML = '<option value="">全部日期</option>' +
      allDates.map(d => `<option value="${d}"${d===coCurDate?' selected':''}>${d}</option>`).join('');
  }

  const gridCols = CO_COLS.map(ci => CO_META[ci][1] + 'px').join(' ');
  let html = `<div class="c-hdr-row" style="grid-template-columns:${gridCols}">`;
  CO_COLS.forEach(ci => {
    const [name,,align] = CO_META[ci];
    html += `<div class="c-hdr" style="justify-content:${align==='left'?'flex-start':'center'}">${name}</div>`;
  });
  html += '</div>';

  const datesToShow = coCurDate ? [coCurDate] : allDates;
  let total = 0;

  for (const date of datesToShow) {
    const grp = groups[date]; if (!grp) continue;
    const cnt = grp.rows.length;
    if (!cnt) continue;

    /* 分隔列：退房日期 ＋ 票數摘要 */
    html += `<div class="c-sep">
      ${date}（${grp.wday}）退房
      <span style="margin-left:10px;font-size:13px;color:#60b3f4;font-weight:700">${cnt}人</span>
      <span style="margin-left:12px;font-weight:400;font-size:11.5px;color:var(--tx2)">
        下山巴士 ${cnt}張&ensp;／&ensp;新幹線 ${cnt}張
      </span>
    </div>`;

    /* 旅客列：訂編(col4) + 中文姓名(col5) 為 label */
    for (const row of grp.rows) {
      const orderNo = String(row[4] || '');
      const name    = String(row[5] || '');
      html += `<div class="c-label"><span class="c-order">${orderNo}</span><span class="c-name">${name}</span></div>`;
      html += `<div class="c-data-row" style="grid-template-columns:${gridCols}">`;
      CO_COLS.forEach(ci => {
        const val = String(row[ci] ?? '');
        const [,,align] = CO_META[ci];
        const hasNote = ci === 14 && val;   // 退房備註有值時黃色提示
        let cls   = 'c-cell' + (align==='left' ? ' c-left' : '');
        let style = hasNote ? ' style="color:#f0c060"' : '';
        html += `<div class="${cls}"${style}>${val}</div>`;
      });
      html += '</div>';
      total++;
    }
  }

  if (!total) html += `<div class="c-label" style="padding:32px;color:var(--tx3);text-align:center">此期間無資料</div>`;
  body.innerHTML = html;
}

/* ════════════════════════════════
   COACH SCHEDULE PAGE（教練班表）
════════════════════════════════ */
const CS_CACHE_KEY    = 'dbc_coach_v2';
const CS_CACHE_TTL    = 15 * 60 * 1000;
const CS_COL_DAY      = 50;     // 每日欄寬
const CS_SEASON_START = 9;      // 9月後算 2026 年；否則 2027 年

let csRawRows = null;
let csColors  = null;

function renderCoach() {
  const pc = document.getElementById('page-content');
  pc.className = 'cs-page';
  pc.innerHTML = `
    <div class="cs-toolbar">
      <span>← 左右滑動瀏覽全季 ｜ 教練名稱凍結</span>
      <button class="c-view c-refresh" onclick="refreshCoach()" title="重新載入">↺</button>
    </div>
    <div class="cs-body" id="cs-body">
      <div class="loading"><div class="spin"></div> 載入中</div>
    </div>`;
  if (csRawRows) renderCSGrid();
  else loadCoach();
}

async function loadCoach() {
  try {
    const cached = localStorage.getItem(CS_CACHE_KEY);
    const ts = parseInt(localStorage.getItem(CS_CACHE_KEY + '_ts') || '0');
    if (cached && Date.now() - ts < CS_CACHE_TTL) {
      const obj = JSON.parse(cached);
      csRawRows = obj.rows || obj;
      csColors  = obj.colors || null;
      renderCSGrid();
      return;
    }
  } catch(e) {}
  try {
    const res  = await fetch(apiUrl('getCoach'), {redirect:'follow'});
    const data = await res.json();
    if (data.status !== 'ok') {
      if (data.message?.includes('Token') || data.message?.includes('未授權')) {
        const body = document.getElementById('cs-body');
        if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3);line-height:2.4">登入已過期<br>
          <button onclick="signOut()" style="margin-top:8px;padding:8px 22px;background:var(--ac);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">重新登入</button></div>`;
        return;
      }
      throw new Error(data.message || '伺服器錯誤');
    }
    csRawRows = data.rows   || [];
    csColors  = data.colors || null;
    try {
      localStorage.setItem(CS_CACHE_KEY, JSON.stringify({rows: csRawRows, colors: csColors}));
      localStorage.setItem(CS_CACHE_KEY + '_ts', String(Date.now()));
    } catch(e) {}
    renderCSGrid();
  } catch(e) {
    try {
      const stale = localStorage.getItem(CS_CACHE_KEY);
      if (stale) {
        const obj = JSON.parse(stale);
        csRawRows = obj.rows || obj;
        csColors  = obj.colors || null;
        renderCSGrid(); return;
      }
    } catch(e2) {}
    const body = document.getElementById('cs-body');
    if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">載入失敗：${e.message}</div>`;
  }
}

async function refreshCoach() {
  csRawRows = null; csColors = null;
  try { localStorage.removeItem(CS_CACHE_KEY); localStorage.removeItem(CS_CACHE_KEY + '_ts'); } catch(e) {}
  const body = document.getElementById('cs-body');
  if (body) body.innerHTML = '<div class="loading"><div class="spin"></div> 載入中</div>';
  await loadCoach();
}

/* 判斷地區分隔列：col0 是地區名 + col1（休假數）為空
   （野澤列右側可能有其他標註如 SAJ-SKI，不能要求整列空）*/
function csIsArea(row) {
  if (!Array.isArray(row) || !row.length) return false;
  const v0 = String(row[0] || '').trim();
  if (!['野澤','斑尾','班尾','湯澤','京都'].includes(v0)) return false;
  const v1 = String(row[1] || '').trim();
  return !v1;   // 休假數欄為空 → 地區分隔列；有數字 → 該地區教練同名（極少）
}

/* 偵測有效日期欄範圍：日期列(index 1) 非空者算入 */
function csActiveCols(rows) {
  if (!rows || rows.length < 2) return 0;
  const dateRow = rows[1] || [];
  let last = 2;
  for (let i = 2; i < dateRow.length; i++) {
    if (String(dateRow[i] || '').trim()) last = i;
  }
  return last + 1;   // exclusive end
}

/* 解析日期字串 → {month, day, wday, dispDate}
   支援 "M/D" 或 "YYYY-M-D"。年份依季節推算（9月後 → 2026；否則 → 2027）*/
const CS_WDAY = ['日','一','二','三','四','五','六'];
function csParseDate(s) {
  s = String(s || '').trim();
  if (!s) return null;
  let y, m, d;
  if (s.includes('-')) {
    const p = s.split('-');
    y = parseInt(p[0]); m = parseInt(p[1]); d = parseInt(p[2]);
  } else if (s.includes('/')) {
    const p = s.split('/');
    if (p.length === 2)      { m = parseInt(p[0]); d = parseInt(p[1]); }
    else if (p.length === 3) { y = parseInt(p[0]); m = parseInt(p[1]); d = parseInt(p[2]); if (y < 100) y += 2000; }
  } else return null;
  if (isNaN(m) || isNaN(d)) return null;
  if (!y) y = (m >= CS_SEASON_START) ? 2026 : 2027;
  const dt = new Date(y, m-1, d);
  if (isNaN(dt.getTime())) return null;
  return { year: y, month: m, day: d, wday: CS_WDAY[dt.getDay()], dispDate: `${m}/${d}` };
}

/* 估算文字寬度：英數 7px、中文/其他 12px（小字型）*/
function csTextWidth(s) {
  s = String(s || '');
  let w = 0;
  for (const ch of s) w += /[\x00-\xff]/.test(ch) ? 7 : 12;
  return w;
}

/* 每個日期欄寬：掃描全部資料找最長 → 加 padding → 夾在 [38, 110] */
function csComputeColWidths(rows, endCol) {
  const widths = [];
  for (let c = 2; c < endCol; c++) {
    let maxW = 0;
    for (let r = 3; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;
      if (csIsArea(row)) continue;
      const w = csTextWidth(row[c]);
      if (w > maxW) maxW = w;
    }
    // 日期/曜日 header 也要塞得下（M/D + 曜日字）
    const hdrW = csTextWidth(String(rows[1] && rows[1][c] || '')) + 4;
    if (hdrW > maxW) maxW = hdrW;
    widths.push(Math.min(110, Math.max(38, maxW + 12)));
  }
  return widths;
}

/* 取得字體顏色（從 Sheet getFontColors）；黑色或預設 → 用 var(--tx) */
function csFontStyle(r, c) {
  if (!csColors || !csColors[r] || !csColors[r][c]) return '';
  const col = String(csColors[r][c] || '').toLowerCase().trim();
  if (!col || col === '#000000' || col === '#000' || col === 'black') return '';
  return `color:${col}`;
}

function renderCSGrid() {
  const body = document.getElementById('cs-body');
  if (!body || !csRawRows) return;
  const rows = csRawRows;
  if (rows.length < 3) {
    body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">尚無班表資料</div>`;
    return;
  }

  const endCol = csActiveCols(rows);
  const nDays  = endCol - 2;
  if (nDays <= 0) {
    body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">尚無日期資料</div>`;
    return;
  }

  /* 預先解析每個日期欄：日期、曜日、是否週末 */
  const dateRow = rows[1] || [];
  const memoRow = rows[2] || [];
  const dateInfo = [];   // index 對應 c (0~nDays-1)
  for (let c = 2; c < endCol; c++) {
    const parsed = csParseDate(dateRow[c]);
    dateInfo.push(parsed || { dispDate: String(dateRow[c]||''), wday: '', month: 0, day: 0 });
  }

  /* 每日欄寬：依資料動態計算 */
  const widths   = csComputeColWidths(rows, endCol);
  const gridCols = widths.map(w => w + 'px').join(' ');

  let html = '';

  /* ── 表頭第一列：日期 + 曜日 sticky top ── */
  html += `<div class="cs-hdr-row" style="grid-template-columns:${gridCols}">`;
  for (let i = 0; i < nDays; i++) {
    const info = dateInfo[i];
    const isWE = (info.wday === '六' || info.wday === '日');
    html += `<div class="cs-hdr">
      <div class="cs-hdr-date">${info.dispDate}</div>
      <div class="cs-hdr-wday${isWE?' we':''}">${info.wday}</div>
    </div>`;
  }
  html += '</div>';

  /* ── 表頭第二列：備註 sticky top（緊接日期下方） ── */
  let hasMemo = false;
  for (let c = 2; c < endCol; c++) {
    if (String(memoRow[c] || '').trim()) { hasMemo = true; break; }
  }
  if (hasMemo) {
    html += `<div class="cs-memo-row" style="grid-template-columns:${gridCols}">`;
    for (let c = 2; c < endCol; c++) {
      const m = String(memoRow[c] || '').trim();
      html += `<div class="cs-memo" title="${m}">${m}</div>`;
    }
    html += '</div>';
  }

  /* ── 資料列（從 row 3 起） ── */
  for (let r = 3; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;

    /* 地區分隔列 */
    if (csIsArea(row)) {
      const area = String(row[0]).trim();
      html += `<div class="cs-area">▎ ${area}</div>`;
      continue;
    }

    const name = String(row[0] || '').trim();
    const off  = String(row[1] || '').trim();
    if (!name) continue;

    /* 教練名 label 列（sticky left，2列模式） */
    html += `<div class="cs-label">
      <span class="cs-coach">${name}</span>
      ${off ? `<span class="cs-off-label">休 ${off}</span>` : ''}
    </div>`;

    /* 排班資料列 */
    html += `<div class="cs-data-row" style="grid-template-columns:${gridCols}">`;
    for (let c = 2; c < endCol; c++) {
      const v        = String(row[c] || '').trim();
      const info     = dateInfo[c-2];
      const we       = (info.wday === '六' || info.wday === '日') ? ' we' : '';
      const empty    = !v ? ' empty' : '';
      const styleCol = csFontStyle(r, c);
      const style    = styleCol ? ` style="${styleCol}"` : '';
      html += `<div class="cs-cell${we}${empty}"${style} title="${v}">${v}</div>`;
    }
    html += '</div>';
  }

  body.innerHTML = html;
}

/* ════════════════════════════════

let myScheduleMonths = [];   // ["2026-12", "2027-1", ...]
let myScheduleMonth  = null;

async function renderMySchedule() {

      </div>`;

  renderMyCalendar();

  document.getElementById('mys-prev').onclick  = () => navMyMonth(-1);

function buildMyScheduleMap(coachName) {
  myScheduleMap    = {};
  myScheduleMonths = [];
  const rows = csRawRows;
  if (!rows || rows.length < 2) return;

  /* 找到該教練的列 */
  let myRow = null;
  for (let r = 3; r < rows.length; r++) {
    if (String(rows[r] && rows[r][0] || '').trim() === coachName) {
      myRow = rows[r];
      break;
    }
  }
  if (!myRow) return;

  const dateRow = rows[1];
  const monthSet = new Set();
  for (let c = 2; c < dateRow.length; c++) {
    const dateStr = String(dateRow[c] || '').trim();
    if (!dateStr) continue;
    const p = csParseDate(dateStr);
    if (!p) continue;
    const ymKey  = `${p.year}-${p.month}`;
    const dayKey = `${p.year}-${p.month}-${p.day}`;
    monthSet.add(ymKey);
    myScheduleMap[dayKey] = String(myRow[c] || '').trim();
  }

  /* 月份排序（YYYY-M 字串需自然數字排序）*/
  myScheduleMonths = Array.from(monthSet).sort((a, b) => {
    const [ay, am] = a.split('-').map(Number);
    const [by, bm] = b.split('-').map(Number);
    return ay !== by ? ay - by : am - bm;
  });

  /* 預設月份：今天的月，若無則第一個有資料的月 */
  const t = new Date();
  const curKey = `${t.getFullYear()}-${t.getMonth()+1}`;
  myScheduleMonth = myScheduleMonths.includes(curKey)
    ? curKey
    : myScheduleMonths[0];
}

function renderMyCalendar() {
  const cal     = document.getElementById('mys-cal');
  const lblM    = document.getElementById('mys-month');
  const lblY    = document.getElementById('mys-year');
  if (!cal || !myScheduleMonth) return;

  const [yStr, mStr] = myScheduleMonth.split('-');
  const year  = parseInt(yStr);
  const month = parseInt(mStr);

  if (lblY) lblY.textContent = `${year}`;
  if (lblM) lblM.textContent = `${month} 月`;

  /* 啟用/停用 prev/next */
  const idx = myScheduleMonths.indexOf(myScheduleMonth);
  const prevBtn = document.getElementById('mys-prev');
  const nextBtn = document.getElementById('mys-next');
  if (prevBtn) prevBtn.disabled = idx <= 0;
  if (nextBtn) nextBtn.disabled = idx >= myScheduleMonths.length - 1;

  const firstWday   = new Date(year, month-1, 1).getDay();    // 0=日
  const daysInMonth = new Date(year, month, 0).getDate();
  const prevMonth   = month === 1 ? 12 : month - 1;
  const prevYear    = month === 1 ? year - 1 : year;
  const daysInPrev  = new Date(prevYear, prevMonth, 0).getDate();
  const nextMonth   = month === 12 ? 1 : month + 1;
  const nextYear    = month === 12 ? year + 1 : year;

  const today      = new Date();
  const isCurMonth = (today.getFullYear() === year && (today.getMonth()+1) === month);

  let html = '';
  /* ── 星期表頭 ── */
  ['日','一','二','三','四','五','六'].forEach((wd, i) => {
    const we = (i === 0 || i === 6) ? ' we' : '';
    html += `<div class="mys-wd${we}">${wd}</div>`;
  });

  /* ── 計算總格數：firstWday + daysInMonth → 補齊至 7 倍數（5 或 6 行） ── */
  const weeks      = Math.ceil((firstWday + daysInMonth) / 7);
  const totalCells = weeks * 7;

  for (let i = 0; i < totalCells; i++) {
    const dayPos = i - firstWday + 1;   // 本月第 dayPos 日；<=0 為上月，>daysInMonth 為下月

    let y, m, d, inMonth;
    if (dayPos < 1) {
      y = prevYear; m = prevMonth; d = daysInPrev + dayPos; inMonth = false;
    } else if (dayPos > daysInMonth) {
      y = nextYear; m = nextMonth; d = dayPos - daysInMonth; inMonth = false;
    } else {
      y = year; m = month; d = dayPos; inMonth = true;
    }

    const wday   = (firstWday + dayPos - 1 + 7) % 7;   // i % 7 等效，這裡用更穩定算法
    const colWd  = i % 7;
    const isWE   = (colWd === 0 || colWd === 6);
    const weCls  = isWE ? ' we-col' : '';
    const numCls = isWE ? ' we' : '';

    const key = `${y}-${m}-${d}`;
    const val = myScheduleMap[key] || '';
    const isToday = inMonth && isCurMonth && today.getDate() === d;
    const isOff   = ['休','事務','病','定休','事假'].includes(val);
    const isTrain = !isOff && (val.includes('訓練') || val.includes('研修') || val.includes('講習'));
    const valCls  = isOff ? ' off' : (isTrain ? ' train' : '');
    const omCls   = inMonth ? '' : ' other-month';
    const tdCls   = isToday ? ' today' : '';

    html += `<div class="mys-day${weCls}${omCls}${tdCls}">
      <div class="mys-day-num${numCls}">${d}${isToday ? '<span class="today-dot"></span>' : ''}</div>
      ${val ? `<div class="mys-day-val${valCls}" title="${val}">${val}</div>` : ''}
    </div>`;
  }

  cal.innerHTML = html;
}

function navMyMonth(dir) {
  const idx = myScheduleMonths.indexOf(myScheduleMonth);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= myScheduleMonths.length) return;
  myScheduleMonth = myScheduleMonths[newIdx];
  renderMyCalendar();
}

function jumpMyToday() {
  const t = new Date();
  const curKey = `${t.getFullYear()}-${t.getMonth()+1}`;
  if (myScheduleMonths.includes(curKey)) {
    myScheduleMonth = curKey;
  } else {
    myScheduleMonth = myScheduleMonths[0];
  }
  renderMyCalendar();
}

  '斑尾': [{max:4,c:'green'},  {max:6,c:'yellow'},  {max:7,c:'orange'},  {max:999,c:'red'}],
  '湯澤': [{max:5,c:'green'},  {max:7,c:'yellow'},  {max:9,c:'orange'},  {max:999,c:'red'}],
  '龍平': [{max:5,c:'green'},  {max:7,c:'yellow'},  {max:9,c:'orange'},  {max:999,c:'red'}],
};

/* ── 計算工具 ── */
function dcrLvGroup(lv) {
  lv = String(lv || '').toLowerCase().trim();
  if (!lv || lv === 'lv0') return 'g0';
  const m = lv.match(/(\d+)/);
  const n = m ? parseInt(m[1]) : 0;
  return n <= 2 ? 'g12' : 'g345';
}

function dcrParseCoachDays(tiansu) {
  if (!tiansu) return 2;
  const s = String(tiansu).trim();
  const m = s.match(/(\d+)/);
  if (!m) return 2;
  const n = parseInt(m[1]);
  if (s.includes('無') && !s.includes('含')) return 2;
  return n || 2;
}

function dcrParseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  const p = s.split('/');
  if (p.length !== 3) return null;
  let y = parseInt(p[0]);
  if (isNaN(y)) return null;
  if (y < 100) y += 2000;
  const m = parseInt(p[1]);
  const d = parseInt(p[2]);
  if (isNaN(m) || isNaN(d)) return null;
  const dt = new Date(y, m-1, d);
  if (isNaN(dt.getTime())) return null;
  return dt;
}

function dcrFmtDate(dt) {
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}

function dcrColor(area, n) {
  if (n === 0) return 'none';
  for (const t of DCR_THR[area]) {
    if (n <= t.max) return t.c;
  }
  return 'red';
}

/* ── 主計算 ── */
function dcrCalcDaily(courseRows) {
  const daily = {};
  const ensure = (ds, area) => {
    if (!daily[ds]) daily[ds] = {};
    if (!daily[ds][area]) daily[ds][area] = {pureOrders:new Set(), g0:0, g12:0, g345:0};
    return daily[ds][area];
  };

  for (const row of courseRows) {
    if (!Array.isArray(row) || row.length < 17) continue;
    if (cIsSep(row)) continue;

    /* 訂編必須是純數字 → 跳過表頭/空白列 */
    const ono = String(row[6] || '').trim();
    if (!/^\d+$/.test(ono)) continue;

    /* 項目1 優先（避免被 CHECKIN 替換成旅館名）*/
    let item = String(row[28] || '').trim();
    if (!item) item = String(row[1] || '').trim();
    if (!item || item === '其他') continue;

    const area = DCR_AREA_MAP[item];
    if (!area) continue;

    const dep = dcrParseDate(row[2]);
    if (!dep) continue;

    const lv     = row[16] || 'lv0';
    const grp    = dcrLvGroup(lv);
    const tiansu = String(row[4] || '').trim();
    const days   = dcrParseCoachDays(tiansu);

    const isPure = DCR_PURE.has(item);

    /* 出發後 1 ~ days 天，每天都產生 1 個 slot */
    for (let d = 1; d <= days; d++) {
      const dt = new Date(dep);
      dt.setDate(dt.getDate() + d);
      const ds   = dcrFmtDate(dt);
      const slot = ensure(ds, area);
      if (isPure) slot.pureOrders.add(ono);
      else        slot[grp]++;
    }
  }

  return daily;
}

function dcrCalcCoaches(d) {
  const g0   = d.g0   || 0;
  const g12  = d.g12  || 0;
  const g345 = d.g345 || 0;
  const pure = d.pureOrders ? d.pureOrders.size : 0;
  const team =
    (g0   > 0 ? Math.ceil(g0  /6) : 0) +
    (g12  > 0 ? Math.ceil(g12 /6) : 0) +
    (g345 > 0 ? Math.ceil(g345/6) : 0);
  return { coaches: pure + team, pure, team, g0, g12, g345 };
}

function dcrBuildRows(daily) {
  const WDAY = ['日','一','二','三','四','五','六'];

  /* 找出資料的最小/最大日期 */
  let minD = null, maxD = null;
  for (const ds in daily) {
    const p = ds.split('/');
    const d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
    if (!minD || d < minD) minD = d;
    if (!maxD || d > maxD) maxD = d;
  }
  if (!minD) return [];

  const rows = [];
  const cur = new Date(minD);
  while (cur <= maxD) {
    const ds = dcrFmtDate(cur);
    const wd = WDAY[cur.getDay()];
    const row = { date: ds, wd, areas: {}, total_jp: 0, total_kr: 0, total: 0 };
    for (const area of DCR_AREAS) {
      const d = (daily[ds] && daily[ds][area]) || {};
      const r = dcrCalcCoaches(d);
      const color = dcrColor(area, r.coaches);
      row.areas[area] = { c: r.coaches, pure: r.pure, team: r.team, color, cap: DCR_CAPS[area] };
      if (area === '龍平') row.total_kr += r.coaches;
      else                 row.total_jp += r.coaches;
      row.total += r.coaches;
    }
    rows.push(row);
    cur.setDate(cur.getDate() + 1);
  }
  return rows;
}

function dcrShouldShow(row) {
  if (dcrFilter === 'all')  return true;
  if (dcrFilter === 'has')  return row.total > 0;
  if (dcrFilter === 'warn') return DCR_AREAS.some(a => {
    const c = row.areas[a].color;
    return c === 'yellow' || c === 'orange' || c === 'red';
  });
  if (DCR_AREAS.includes(dcrFilter)) return (row.areas[dcrFilter].c || 0) > 0;
  return true;
}

  if (dcrView === 'table') dcrRenderTable();

  const el = document.getElementById('dcr-content');
  if (!dcrComputedRows) return;

  let html = `<div class="dcr-tbl-wrap"><table class="dcr-tbl">

      <col style="width:15%">
      <col style="width:7%">

      <th rowspan="2">合計</th>
    </tr>
    <tr><th></th><th></th><th></th><th></th></tr>
  </thead><tbody>`;

  let prevMonth = '';
  let visible = 0;
  for (const row of dcrComputedRows) {
    if (!dcrShouldShow(row)) continue;

    const month = row.date.slice(0, 7);   // YYYY/MM
    if (month !== prevMonth) {
      html += `<tr class="dcr-month-hdr"><td colspan="9">${month}</td></tr>`;
      prevMonth = month;
    }

    const isWE = (row.wd === '六' || row.wd === '日');
    let cls = '';
    if (row.total > 0) cls += 'dcr-has-data ';
    if (isWE)          cls += 'dcr-weekend';

    let cols = '';
    for (const a of DCR_AREAS) {
      const d = row.areas[a];
      if (!d.c) {
        cols += `<td><div class="dcr-badge dcr-cb-none">—</div></td>`;
      } else {
        const tip = `純${d.pure} 團${d.team} / 上限${d.cap}`;
        cols += `<td><div class="dcr-badge dcr-cb-${d.color}" title="${tip}">${d.c}</div></td>`;

    const jpWarn = row.total_jp >= 25 ? 'warn-r' : row.total_jp >= 20 ? 'warn-o' : row.total_jp >= 15 ? 'warn-y' : '';

    html += `<tr class="${cls.trim()}">
      <td class="dcr-date">${row.date.slice(5)}</td>
      <td class="dcr-wd${isWE?' we':''}">${row.wd}</td>
      ${cols}
      <td><span class="dcr-total-jp ${jpWarn}">${row.total_jp || '—'}</span></td>
      <td><span class="dcr-total-kr">${row.total_kr || '—'}</span></td>
      <td><span class="dcr-total">${row.total || '—'}</span></td>
    </tr>`;
    visible++;
  }
  html += '</tbody></table></div>';

  if (!visible) html = '<div style="padding:40px;text-align:center;color:var(--tx3)">無符合條件的資料</div>';
  el.innerHTML = html;
}
