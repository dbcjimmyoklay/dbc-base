/* ── 累積 ── */
function saSetCum(range, btn) {
  if (btn) {
    btn.parentElement.querySelectorAll('.sa-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  let pts = saData.cumulative;
  if (range !== 'all') {
    const days = range === '1m' ? 30 : 90;
    const last = new Date(pts[pts.length-1].d);
    const cut  = new Date(last); cut.setDate(cut.getDate() - days);
    pts = pts.filter(p => new Date(p.d) >= cut);
  }
  saDestroyChart('cum');
  saCharts.cum = new Chart(document.getElementById('sa-cumC'), {
    type:'line',
    data:{
      labels: pts.map(p => p.d.slice(5)),
      datasets:[{
        data: pts.map(p => p.c),
        borderColor:'#10b981',
        backgroundColor: saCo('#10b981', .1),
        fill:true, tension:.35, borderWidth:2, pointRadius:0,
      }]
    },
    options: { ...saChartOpts() }
  });
}

/* ── 每日新增（數字為主，迷你柱狀為輔，最新在上） ── */
const SA_WDAY = ['日','一','二','三','四','五','六'];

function saSetDailyRange(range, btn) {
  if (btn) {
    document.querySelectorAll('#sa-daily-tabs .sa-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  let pts = saData.daily_signup;
  if (range === '30' || range === '14') {
    const n = parseInt(range);
    const last = new Date(pts[pts.length-1].d);
    const cut  = new Date(last); cut.setDate(cut.getDate() - n);
    pts = pts.filter(p => new Date(p.d) >= cut);
  }
  saRenderDayMini('sa-dailyMiniC', 'daily', pts, '#f59e0b', /*showAxis*/ true);
  saRenderDayList('sa-daily-list', pts, /*reverse*/ true);
}

/* ── 出發人次 ── */
function saSetDepRange(range, btn) {
  /* 保留為兼容性（已無 tab），永遠顯示全部 */
  const pts = saData.departure;
  saRenderDayMini('sa-depMiniC', 'dep', pts, '#06b6d4', /*showAxis*/ true);
  saRenderDayList('sa-dep-list', pts, /*reverse*/ false);
}

/* 迷你柱狀 - 只顯示合計
   showAxis=true 時顯示 X 軸日期 */
function saRenderDayMini(canvasId, chartKey, pts, color, showAxis) {
  saDestroyChart(chartKey);
  /* 智慧 maxTicks：依資料量決定刻度密度 */
  const maxTicks = pts.length > 60 ? 10 : pts.length > 30 ? 14 : 18;
  saCharts[chartKey] = new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{
      labels: pts.map(p => p.d.slice(5)),   // MM-DD
      datasets:[{ data: pts.map(p => p.total), backgroundColor: saCo(color, .8), borderRadius:1, borderSkipped:false }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{ backgroundColor:'#001f3d', borderColor:'#0d3d75', borderWidth:1, titleColor:'#fff', bodyColor:'#8aadcc', padding:8, cornerRadius:6, displayColors:false,
          callbacks:{
            title: items => items[0].label,
            label: item => `${item.parsed.y} 人`
          }
        }
      },
      scales:{
        x:{
          display: !!showAxis,
          grid:{ display:false },
          ticks:{ color:'#4a7299', font:{size:9}, maxTicksLimit:maxTicks, autoSkip:true }
        },
        y:{ display:false }
      }
    }
  });
}

/* 列表渲染：日期 + 各區 + 合計 + 比例 bar */
function saRenderDayList(elId, pts, reverse) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!pts.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--tx3);font-size:11px">無資料</div>'; return; }

  const ordered = reverse ? [...pts].reverse() : pts;
  const maxTotal = Math.max(...pts.map(p => p.total), 1);

  let html = '';
  for (const p of ordered) {
    const dt = new Date(p.d);
    const wd = SA_WDAY[dt.getDay()];
    const isWE = (wd === '六' || wd === '日');
    const mmdd = p.d.slice(5).replace('-', '/');

    const areas = SA_AREAS.map(a => {
      const v = p[a] || 0;
      return v > 0 ? `<span class="has" style="color:${SA_AC[a]}">${a[0]}${v}</span>`
                   : `<span class="no">${a[0]}—</span>`;
    }).join('');

    const barPct = p.total ? (p.total / maxTotal * 100) : 0;
    const empty  = p.total === 0;

    html += `<div class="sa-day-row${isWE?' we':''}${empty?' empty':''}">
      <span class="sa-day-date${isWE?' we':''}"><b>${mmdd}</b> ${wd}</span>
      <span class="sa-day-areas">${areas}</span>
      <span class="sa-day-total">${p.total || '—'}</span>
      <div class="sa-day-bar${empty?' empty':''}"><div class="sa-day-bar-i" style="width:${barPct}%"></div></div>
    </div>`;
  }
  el.innerHTML = html;
}

/* ── YoY 初始化 + 切換 ── */
let saYoyKey = null;

function saInitYoy() {
  const tabsEl = document.getElementById('sa-yoy-tabs');
  if (!tabsEl) return;
  /* 倒序：最新一年放第一個（預設選中）*/
  const comps = [...saData.yoy.comparisons].reverse();
  tabsEl.innerHTML = comps.map((c, i) =>
    `<button class="sa-tab${i === 0 ? ' active' : ''}" onclick="saSetYoy('${c.season}',this)">vs ${c.season}</button>`
  ).join('');
  saYoyKey = comps[0].season;
  saRenderYoyCharts();
}

function saSetYoy(season, btn) {
  if (btn) {
    btn.parentElement.querySelectorAll('.sa-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  saYoyKey = season;
  saRenderYoyCharts();
}

function saRenderYoyCharts() {
  const comp = saData.yoy.comparisons.find(c => c.season === saYoyKey);
  if (!comp) return;

  /* ── 摘要文字 ── */
  const sumEl = document.getElementById('sa-yoy-summary');
  if (sumEl) {
    const curN  = comp.same_period.current.length ? comp.same_period.current[comp.same_period.current.length-1] : 0;
    const prevN = comp.same_period.prev.length    ? comp.same_period.prev[comp.same_period.prev.length-1]       : 0;
    const diff  = curN - prevN;
    const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
    const diffPct = prevN > 0 ? `(${(diff/prevN*100).toFixed(1)}%)` : '';
    const diffColor = diff > 0 ? '#10b981' : diff < 0 ? '#ef4444' : 'var(--tx3)';
    const dayN = saData.yoy.cur_max_day;
    sumEl.innerHTML = `
      開賣後第 <b style="color:var(--tx);font-family:monospace">${dayN}</b> 天（截至今日）：
      <b style="color:#10b981;font-family:monospace">本季 ${curN.toLocaleString()}</b> 人 ｜
      ${comp.season} 同期 <b style="color:#8b5cf6;font-family:monospace">${prevN.toLocaleString()}</b> 人 ｜
      差距 <b style="color:${diffColor};font-family:monospace">${diffStr} ${diffPct}</b>
      <br>
      <span style="font-size:11px;color:var(--tx3)">${comp.season} 整季結算共 ${comp.prev_total.toLocaleString()} 人</span>`;
  }

  /* ── 同檔期累積 ── */
  saDestroyChart('yoyCum');
  saCharts.yoyCum = new Chart(document.getElementById('sa-yoyCumC'), {
    type:'line',
    data:{
      labels: comp.same_period.days,
      datasets:[
        { label:`本季 ${saData.current_season}`, data: comp.same_period.current,
          borderColor:'#10b981', backgroundColor: saCo('#10b981', .12),
          fill:true, tension:.3, borderWidth:2, pointRadius:0 },
        { label:`${comp.season} 同期`, data: comp.same_period.prev,
          borderColor:'#8b5cf6', backgroundColor:'transparent', borderDash:[5,4],
          tension:.3, borderWidth:2, pointRadius:0 },
      ]
    },
    options:{
      ...saChartOpts(),
      plugins:{
        ...saChartOpts().plugins,
        legend:{ display:true, position:'bottom', labels:{color:'#8aadcc',font:{size:10},boxWidth:14,padding:8} },
        tooltip:{
          ...saChartOpts().plugins.tooltip,
          callbacks:{ title: (items) => `開賣後第 ${items[0].label} 天` }
        }
      },
      scales:{
        x:{ ...saChartOpts().scales.x,
            title:{display:true, text:'開賣後天數（5/1 為 day 0）', color:'#4a7299', font:{size:10}},
            ticks:{ ...saChartOpts().scales.x.ticks, maxTicksLimit:10 } },
        y:{ ...saChartOpts().scales.y,
            title:{display:true, text:'累積報名人次', color:'#4a7299', font:{size:10}} },
      }
    }
  });

  /* ── 同日比 ── */
  saDestroyChart('yoyMd');
  saCharts.yoyMd = new Chart(document.getElementById('sa-yoyMdC'), {
    type:'bar',
    data:{
      labels: comp.same_date.labels,
      datasets:[
        { label:`本季 ${saData.current_season}`, data: comp.same_date.current,
          backgroundColor: saCo('#10b981', .85), borderRadius:1, borderSkipped:false },
        { label:`${comp.season}`, data: comp.same_date.prev,
          backgroundColor: saCo('#8b5cf6', .6),  borderRadius:1, borderSkipped:false },
      ]
    },
    options:{
      ...saChartOpts(),
      plugins:{
        ...saChartOpts().plugins,
        legend:{ display:true, position:'bottom', labels:{color:'#8aadcc',font:{size:10},boxWidth:10,padding:8} }
      },
      scales:{
        x:{ ...saChartOpts().scales.x,
            title:{display:true, text:'出發月/日（按季內順序 5→4 月）', color:'#4a7299', font:{size:10}},
            ticks:{ ...saChartOpts().scales.x.ticks, maxTicksLimit:24 } },
        y:{ ...saChartOpts().scales.y,
            title:{display:true, text:'出發人次', color:'#4a7299', font:{size:10}} },
      }
    }
  });
}

/* ── 客群 KPI ── */
function saRenderDemoKpi() {
  const D = saData;
  const el = document.getElementById('sa-demo-kpi');
  const m = D.demographics.gender['男'] || 0;
  const f = D.demographics.gender['女'] || 0;
  const single = D.demographics.ski_type['單板'] || 0;
  const double = D.demographics.ski_type['雙板'] || 0;
  const lv0 = D.demographics.level['lv0'] || 0;
  const totalGender = m + f || 1;
  const totalSki = single + double || 1;
  const totalLv = Object.values(D.demographics.level).reduce((s,v) => s+v, 0) || 1;

  const items = [
    { l:'女性', v:f, s:`${(f/totalGender*100).toFixed(1)}%`, c:'#ec4899' },
    { l:'男性', v:m, s:`${(m/totalGender*100).toFixed(1)}%`, c:'#3b82f6' },
    { l:'單板', v:single, s:`${(single/totalSki*100).toFixed(1)}%`, c:'#06b6d4' },
    { l:'雙板', v:double, s:`${(double/totalSki*100).toFixed(1)}%`, c:'#f59e0b' },
    { l:'初學(lv0)', v:lv0, s:`${(lv0/totalLv*100).toFixed(1)}%`, c:'#8b5cf6' },
  ];
  el.innerHTML = items.map(it => `<div class="sa-mk" style="--mkc:${it.c}">
    <div class="sa-mk-l">${it.l}</div>
    <div class="sa-mk-v" style="color:${it.c}">${it.v.toLocaleString()}</div>
    <div class="sa-mk-s">${it.s}</div>
  </div>`).join('');
}

/* ── 跨年回頭客明細：可展開 ── */
let saRtSortKey = 'count';
let saRtSearch  = '';

function saRtSearchChg(v) { saRtSearch = (v||'').trim(); saRtRenderCustomerModal(); }
function saRtSetSort(k, btn) {
  saRtSortKey = k;
  btn.parentElement.querySelectorAll('.dcr-fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  saRtRenderCustomerModal();
}
function saRtSorted() {
  const all = saData.returning.customers || [];
  const q   = saRtSearch.toLowerCase();
  const list = q ? all.filter(c => c.name.toLowerCase().includes(q)) : [...all];
  if (saRtSortKey === 'fee')  list.sort((a, b) => b.total_fee - a.total_fee);
  if (saRtSortKey === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  return list;
}
function saRtToggle(rowEl) {
  const wrap = rowEl.parentElement;
  const det  = wrap.querySelector('.sa-rt-c-detail');
  const arr  = rowEl.querySelector('.sa-rt-c-arr');
  const open = det.style.display !== 'none';
  det.style.display = open ? 'none' : 'block';
  arr.textContent   = open ? '▸' : '▾';
}
function saRtRenderCustomerModal() {
  const body = document.getElementById('sa-rt-modal-body');
  const cnt  = document.getElementById('sa-rt-mc');
  if (!body) return;
  const list = saRtSorted();
  if (cnt) cnt.textContent = list.length;
  if (!list.length) { body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--tx3);font-size:12px">無符合資料</div>'; return; }

  let html = '';

    html += `<div class="sa-rt-c">
      <div class="sa-rt-c-row" onclick="saRtToggle(this)">

        <span class="sa-rt-c-name">${c.name}</span>
        <span class="sa-rt-c-count">${c.total_signups} 次</span>
        <span class="sa-rt-c-fee">${c.total_fee.toLocaleString()}</span>
      </div>
      <div class="sa-rt-c-detail" style="display:none">
        <table style="width:100%;border-collapse:collapse;font-size:11.5px;background:var(--bg0)">
          <thead><tr>
            <th style="text-align:left;padding:6px 8px 6px 32px;color:var(--tx3);font-size:10px;font-weight:600">雪季</th>
            <th style="text-align:left;padding:6px 8px;color:var(--tx3);font-size:10px;font-weight:600">雪場</th>
            <th style="text-align:left;padding:6px 8px;color:var(--tx3);font-size:10px;font-weight:600">出發日</th>
            <th style="text-align:center;padding:6px 6px;color:var(--tx3);font-size:10px;font-weight:600">類型</th>
            <th style="text-align:right;padding:6px 14px 6px 8px;color:var(--tx3);font-size:10px;font-weight:600">團費</th>
          </tr></thead>
          <tbody>
            ${c.signups.map(s => {
              const skiC = s.ski === '單板' ? '#06b6d4' : s.ski === '雙板' ? '#f59e0b' : 'var(--tx3)';
              const dep  = s.date ? s.date.replace(/^20/, '').replace(/^\d{4}\//, m => m.slice(2)) : '—';
              return `<tr style="border-top:1px solid var(--bd)">
                <td style="padding:6px 8px 6px 32px;color:#8b5cf6;font-family:monospace;font-size:10.5px">${s.season}</td>
                <td style="padding:6px 8px;color:${SA_AC[s.area]||'var(--tx)'};font-weight:500">${s.area}</td>

                <td style="padding:6px 14px 6px 8px;text-align:right;color:var(--tx);font-family:monospace">${s.fee.toLocaleString()}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  });
  body.innerHTML = html;
}

/* ── 加購 ── */
function saRenderAddons() {
  const D = saData.addons;
  const total = saData.overview.total_pax;
  const el = document.getElementById('sa-addon-g');
  el.innerHTML = Object.entries(D).map(([name, val]) => {
    const pct = total ? (val/total*100).toFixed(1) : 0;
    return `<div class="sa-addon-c">
      <div class="sa-addon-n">${val.toLocaleString()}</div>
      <div class="sa-addon-l">${name}</div>
      <div class="sa-addon-p">${pct}%</div>
    </div>`;
  }).join('');
}

function dcrRenderCalendar() {
  const el = document.getElementById('dcr-content');
  if (!dcrComputedRows) return;

  /* 依月份分組 */
  const months = {};
  for (const row of dcrComputedRows) {
    if (!dcrShouldShow(row)) continue;
    const m = row.date.slice(0, 7);
    if (!months[m]) months[m] = [];
    months[m].push(row);
  }

  const COLOR_MAP = {'green':'#10b981','yellow':'#f59e0b','orange':'#f97316','red':'#ef4444','none':'#64748b'};
  const COLOR_BG  = {'green':'16,185,129','yellow':'245,158,11','orange':'249,115,22','red':'239,68,68','none':'100,116,139'};

  let html = '<div class="dcr-cal-wrap">';
  const monthKeys = Object.keys(months).sort();
  if (!monthKeys.length) html += '<div style="padding:40px;text-align:center;color:var(--tx3)">無符合條件的資料</div>';

  for (const monthKey of monthKeys) {
    const [y, mo] = monthKey.split('/').map(Number);
    const firstDay = new Date(y, mo-1, 1).getDay();
    const dim      = new Date(y, mo, 0).getDate();

    const dayMap = {};
    months[monthKey].forEach(r => {
      dayMap[parseInt(r.date.split('/')[2])] = r;
    });

    html += `<div class="dcr-cal-month">
      <div class="dcr-cal-title">${monthKey}</div>
      <div class="dcr-cal-grid">`;
    ['日','一','二','三','四','五','六'].forEach(d => {
      html += `<div class="dcr-cal-dow">${d}</div>`;
    });
    for (let i = 0; i < firstDay; i++) html += '<div class="dcr-cal-day empty"></div>';

    for (let d = 1; d <= dim; d++) {
      const row  = dayMap[d];
      const date = new Date(y, mo-1, d);
      const dow  = date.getDay();
      const isW  = (dow === 0 || dow === 6);
      const hasD = row && row.total > 0;

      let badges = '';
      if (row) {
        for (const a of DCR_AREAS) {
          const dd = row.areas[a];
          if (!dd || dd.c === 0) continue;
          const c = dd.color;
          badges += `<div class="dcr-cal-bdg" style="background:rgba(${COLOR_BG[c]},.12)">
            <div class="dcr-cal-bdg-dot" style="background:${COLOR_MAP[c]}"></div>
            <span class="dcr-cal-bdg-area">${a[0]}</span>
            <span class="dcr-cal-bdg-n" style="color:${COLOR_MAP[c]}">${dd.c}</span>
          </div>`;
        }
      }

      const cls = 'dcr-cal-day' + (isW?' we':'') + (hasD?' has-data':'');
      html += `<div class="${cls}">
        <div class="dcr-cal-date${isW?' we':''}">${d}</div>
        <div class="dcr-cal-badges">${badges}</div>
      </div>`;
    }
    html += '</div></div>';
  }

  html += '</div>';
  el.innerHTML = html;
}
</script>
