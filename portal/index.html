<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000b18">
<title>DBC</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:    #000b18;   /* 最深底色 */
  --bg1:    #001529;   /* 側欄 */
  --bg2:    #001f3d;   /* 卡片 */
  --bg3:    #002a52;   /* hover */
  --bd:     #0a3260;   /* 邊框 */
  --bd2:    #0d3d75;   /* 淺邊框 */
  --tx:     #ffffff;   /* 主文字 */
  --tx2:    #8aadcc;   /* 次文字 */
  --tx3:    #4a7299;   /* 說明文字 */
  --ac:     #1a6fb5;   /* 藍色強調 */
  --ac2:    #2489d6;   /* 亮藍 */
  --nav-w:  220px;
  --top-h:  52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg0);
  color: var(--tx);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════
   LOGO SVG
════════════════════════════════ */
.dbc-logo svg { width: 96px; height: auto; display: block; }

/* ════════════════════════════════
   LOGIN
════════════════════════════════ */
#login-screen {
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg0);
  position: relative; overflow: hidden;
}
#login-screen::before {
  content: '';
  position: absolute; top: -30%; left: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(ellipse, rgba(26,111,181,.12) 0%, transparent 70%);
  pointer-events: none;
}
.login-card {
  position: relative; z-index: 1;
  width: 380px; max-width: 92vw;
  padding: 48px 40px 40px;
  background: var(--bg1);
  border: 1px solid var(--bd);
  border-radius: 16px;
}
.login-logo { margin-bottom: 32px; }
.login-divider {
  height: 1px; background: var(--bd);
  margin: 28px 0;
}
.login-title { font-size: 20px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--tx2); margin-bottom: 28px; }
.g-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 20px;
  background: var(--tx); color: #1a1a1a;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 500; letter-spacing: -.1px;
  cursor: pointer; transition: opacity .15s;
}
.g-btn:hover { opacity: .9; }
.g-btn img { width: 18px; height: 18px; }

/* ════════════════════════════════
   REGISTER / PENDING
════════════════════════════════ */
.center-screen {
  min-height: 100dvh; display: none;
  align-items: center; justify-content: center;
  background: var(--bg0);
}
.center-card {
  width: 400px; max-width: 92vw;
  padding: 48px 40px;
  background: var(--bg1);
  border: 1px solid var(--bd);
  border-radius: 16px;
  text-align: center;
}
.status-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--bg2); border: 1px solid var(--bd2);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin: 0 auto 20px;
}
.center-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.center-sub { font-size: 13px; color: var(--tx2); line-height: 1.7; margin-bottom: 20px; }
.email-badge {
  display: inline-block;
  background: var(--bg2); border: 1px solid var(--bd2);
  border-radius: 6px; padding: 6px 14px;
  font-size: 12px; color: var(--ac2);
  font-family: 'SF Mono', 'Fira Code', monospace;
  margin-bottom: 24px; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.input-field {
  width: 100%; padding: 12px 16px;
  background: var(--bg0); border: 1px solid var(--bd2);
  border-radius: 10px; color: var(--tx);
  font-size: 14px; font-family: inherit;
  outline: none; transition: border-color .15s;
  margin-bottom: 14px;
}
.input-field:focus { border-color: var(--ac2); }
.input-field::placeholder { color: var(--tx3); }
.btn-primary {
  width: 100%; padding: 13px;
  background: var(--tx); color: #0a1628;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  margin-bottom: 10px;
}
.btn-primary:hover { opacity: .9; }
.btn-ghost {
  width: 100%; padding: 11px;
  background: transparent; color: var(--tx3);
  border: 1px solid var(--bd); border-radius: 10px;
  font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.btn-ghost:hover { color: var(--tx2); border-color: var(--bd2); }

/* ════════════════════════════════
   APP SHELL
════════════════════════════════ */
#app-screen { display: none; }

/* Sidebar */
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--nav-w);
  background: var(--bg1);
  border-right: 1px solid var(--bd);
  display: flex; flex-direction: column;
  z-index: 200; transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.sb-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.sb-logo { flex: 1; }
.sb-logo svg { width: 72px; height: auto; }
.sb-nav {
  flex: 1; overflow-y: auto; padding: 8px 0;
  scrollbar-width: none;
}
.sb-nav::-webkit-scrollbar { display: none; }

.nav-section-label {
  padding: 12px 16px 4px;
  font-size: 10px; font-weight: 600;
  color: var(--tx3); text-transform: uppercase; letter-spacing: 1.2px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; margin: 1px 8px;
  border-radius: 8px; cursor: pointer;
  font-size: 13.5px; font-weight: 400; color: var(--tx2);
  transition: all .15s; user-select: none;
}
.nav-item:hover { background: var(--bg3); color: var(--tx); }
.nav-item.active {
  background: rgba(26,111,181,.2);
  color: #60b3f4;
  font-weight: 500;
}
.nav-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  opacity: .7;
}
.nav-item.active .nav-icon { opacity: 1; }

/* Sub nav */
.nav-sub .nav-item {
  padding: 8px 12px 8px 20px;
  font-size: 13px; margin: 0 8px 1px;
}

/* Sidebar bottom */
.sb-bottom {
  padding: 12px; border-top: 1px solid var(--bd); flex-shrink: 0;
}
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg2); margin-bottom: 8px;
}
.user-av {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ac); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  overflow: hidden;
}
.user-av img { width: 100%; height: 100%; object-fit: cover; }
.user-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--tx3); white-space: nowrap; }
.btn-out {
  width: 100%; padding: 8px;
  background: transparent; color: var(--tx3);
  border: 1px solid var(--bd); border-radius: 7px;
  font-size: 12px; cursor: pointer; transition: all .15s;
}
.btn-out:hover { color: #f87171; border-color: #7f1d1d; }

/* Main content */
.main {
  margin-left: var(--nav-w);
  min-height: 100dvh;
  display: flex; flex-direction: column;
}
.topbar {
  height: var(--top-h); flex-shrink: 0;
  background: var(--bg0);
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-menu { display: none; background: none; border: none; color: var(--tx2); cursor: pointer; padding: 4px; }
.topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
.topbar-tag {
  font-size: 11px; color: var(--tx3);
  background: var(--bg2); border: 1px solid var(--bd);
  border-radius: 4px; padding: 3px 8px;
}

.page { flex: 1; padding: 28px 24px; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
.page-header p { font-size: 13px; color: var(--tx2); margin-top: 4px; }

/* Home grid */
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.home-card {
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-radius: 12px; padding: 20px 18px;
  cursor: pointer; transition: all .18s;
  text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 10px;
}
.home-card:hover {
  background: var(--bg3);
  border-color: var(--bd2);
  transform: translateY(-1px);
}
.home-card-icon {
  width: 36px; height: 36px; border-radius: 9px;
  background: rgba(26,111,181,.15);
  display: flex; align-items: center; justify-content: center;
}
.home-card-icon svg { width: 18px; height: 18px; }
.home-card-title { font-size: 13.5px; font-weight: 600; }
.home-card-desc { font-size: 12px; color: var(--tx3); }

/* Placeholder */
.wip {
  background: var(--bg1); border: 1px solid var(--bd);
  border-radius: 12px; padding: 60px 24px;
  text-align: center; color: var(--tx3);
}
.wip-title { font-size: 15px; font-weight: 500; color: var(--tx2); margin: 12px 0 6px; }

/* Overlay */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 199; backdrop-filter: blur(2px);
}

/* Loading */
.loading {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; height: 160px; color: var(--tx3); font-size: 13px;
}
.spin {
  width: 16px; height: 16px;
  border: 2px solid var(--bd2); border-top-color: var(--ac2);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Mobile */
@media (max-width: 768px) {
  :root { --nav-w: 220px; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,.5); }
  .overlay.show { display: block; }
  .main { margin-left: 0; }
  .topbar-menu { display: flex; align-items: center; }
  .page { padding: 20px 16px; }
  .home-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .home-card { padding: 16px 14px; }
}
</style>
</head>

    <button class="btn-ghost" onclick="signOut()">取消</button>
  </div>
</div>

      <button class="topbar-menu" onclick="toggleSidebar()">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div class="topbar-title" id="page-title">首頁</div>
      <div class="topbar-tag" id="user-tag"></div>
    </div>
    <div class="page" id="page-content">
      <div class="loading"><div class="spin"></div> 載入中</div>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const CLIENT_ID   = '278003648368-dd08o1b24knf3tlvhfp7rustnq3cs2gc.apps.googleusercontent.com';
const API         = 'https://script.google.com/macros/s/AKfycbw2-7v48isKdkrJyZNCJEI1UEFfbL3lupGZwUPO4vHyt9B3AjkxKaV3ZHQlvz_LenOI/exec';

const PAGES = {
  '課程安排'    : { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>', section: '課程', desc: '旅客課程安排' },
  '入住單－野澤': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>', section: '入住單', desc: '野澤入住＋車況' },
  '入住單－斑尾': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>', section: '入住單', desc: '斑尾入住＋車況' },
  '入住單－龍平': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>', section: '入住單', desc: '龍平入住＋車況' },
  '送客單－野澤': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>', section: '送客單', desc: '野澤送客資訊' },
  '送客單－斑尾': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>', section: '送客單', desc: '斑尾送客資訊' },
  '送客單－龍平': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>', section: '送客單', desc: '龍平送客資訊' },
  '教練班表'    : { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>', section: '管理', desc: '教練排班' },
  '每日教練需求': { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>', section: '管理', desc: '各場館教練需求' },
  '銷量分析'    : { icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/>', section: '管理', desc: '銷量統計' },
};

let currentUser = null;
let idToken     = null;

function svgIcon(path) {
  return `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${path}</svg>`;
}

/* ── 登入 ── */
function signIn() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false });
  google.accounts.id.prompt(n => {
    if (n.isNotDisplayed() || n.isSkippedMoment()) {
      google.accounts.id.renderButton(document.querySelector('.g-btn').parentNode, { theme: 'outline', size: 'large' });
    }
  });
}

function onCredential(resp) {
  idToken = resp.credential;
  callAPI({token: idToken, action: 'check'});
}

async function callAPI(params) {
  try {
    const qs  = new URLSearchParams(params);
    const res = await fetch(`${API}?${qs}`, { redirect: 'follow' });
    handleResult(await res.json());
  } catch(e) { alert('連線失敗，請稍後再試'); }
}

function handleResult(d) {
  hide('login-screen'); hide('register-screen'); hide('pending-screen'); hide('app-screen');
  if (d.status === 'approved') { currentUser = d; showApp(); }
  else if (d.status === 'new_user') { showRegister(d.email); }
  else if (d.status === 'pending')  { showPending(d.email); }
  else if (d.status === 'disabled') { alert('此帳號已停用，請聯絡管理員。'); show('login-screen', 'flex'); }
  else { alert('錯誤：' + (d.message||'請重試')); show('login-screen', 'flex'); }
}

function showRegister(email) {
  show('register-screen', 'flex');
  document.getElementById('reg-email').textContent = email;
}
async function submitRegister() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { alert('請填寫姓名'); return; }
  await callAPI({ token: idToken, name, action: 'register' });
}

function showPending(email) {
  show('pending-screen', 'flex');
  document.getElementById('pend-email').textContent = email;
}

/* ── 主畫面 ── */
function showApp() {
  show('app-screen');
  const u = currentUser;
  document.getElementById('uname').textContent  = u.name || u.email;
  document.getElementById('urole').textContent  = u.role;
  document.getElementById('user-tag').textContent = u.role;
  const av = document.getElementById('uav');
  av.textContent = (u.name || u.email)[0].toUpperCase();
  buildNav(u.pages || []);
  showHome();
}

function buildNav(pages) {
  const menu = document.getElementById('nav-menu');
  let html = `<div class="nav-item active" id="nav-home" onclick="showHome()">
    ${svgIcon('<path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>')}
    首頁</div>`;

  const secs = {};
  pages.forEach(p => {
    const s = PAGES[p]?.section || '其他';
    if (!secs[s]) secs[s] = [];
    secs[s].push(p);
  });

  Object.entries(secs).forEach(([sec, ps]) => {
    html += `<div class="nav-section-label">${sec}</div>`;
    ps.forEach(p => {
      const def = PAGES[p] || {};
      const id  = 'n-' + p.replace(/[^a-z0-9]/gi, '-');
      html += `<div class="nav-item" id="${id}" onclick="go('${p}')">${svgIcon(def.icon||'')} ${p}</div>`;
    });
  });
  menu.innerHTML = html;
}

function go(page) {
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  const el = document.getElementById('n-' + page.replace(/[^a-z0-9]/gi, '-'));
  if (el) el.classList.add('active');
  document.getElementById('page-title').textContent = page;
  document.getElementById('page-content').innerHTML = '<div class="loading"><div class="spin"></div> 載入中</div>';
  closeSidebar();
  setTimeout(() => {
    document.getElementById('page-content').innerHTML = `
      <div class="page-header"><h1>${page}</h1><p>${PAGES[page]?.desc||''}</p></div>
      <div class="wip">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 6V12L16 14M22 12C22 17.523 17.523 22 12 22C6.477 22 2 17.523 2 12C2 6.477 6.477 2 12 2C17.523 2 22 6.477 22 12Z"/>
        </svg>
        <div class="wip-title">建置中</div>
        <p style="font-size:12px">此功能即將上線</p>
      </div>`;
  }, 200);
}

function showHome() {
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.getElementById('nav-home')?.classList.add('active');
  document.getElementById('page-title').textContent = '首頁';
  closeSidebar();
  const pages = currentUser.pages || [];
  const cards = pages.map(p => {
    const d = PAGES[p] || {};
    return `<div class="home-card" onclick="go('${p}')">
      <div class="home-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${d.icon||''}</svg>
      </div>
      <div class="home-card-title">${p}</div>
      <div class="home-card-desc">${d.desc||''}</div>
    </div>`;
  }).join('');
  document.getElementById('page-content').innerHTML = `
    <div class="page-header">
      <h1>歡迎，${currentUser.name || ''}</h1>
      <p style="color:var(--tx3)">選擇功能開始工作</p>
    </div>
    <div class="home-grid">${cards}</div>`;
}

function signOut() {
  google.accounts.id.disableAutoSelect();
  currentUser = null; idToken = null;
  hide('register-screen'); hide('pending-screen'); hide('app-screen');
  show('login-screen', 'flex');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function show(id, d='block') { document.getElementById(id).style.display = d; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

window.onload = () => {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true });
  google.accounts.id.prompt();
};
</script>
</body>
</html>
