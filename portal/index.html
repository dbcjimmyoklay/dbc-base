<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000b18">
<title>DBC</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:    #000b18;   /* 最深底色 */
  --bg1:    #001529;   /* 側欄 */
  --bg2:    #001f3d;   /* 卡片 */
  --bg3:    #002a52;   /* hover */
  --bd:     #0a3260;   /* 邊框 */
  --bd2:    #0d3d75;   /* 淺邊框 */
  --tx:     #ffffff;   /* 主文字 */
  --tx2:    #8aadcc;   /* 次文字 */
  --tx3:    #4a7299;   /* 說明文字 */
  --ac:     #1a6fb5;   /* 藍色強調 */
  --ac2:    #2489d6;   /* 亮藍 */
  --nav-w:  220px;
  --top-h:  52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg0);
  color: var(--tx);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════
   LOGO SVG
════════════════════════════════ */
.dbc-logo svg { width: 96px; height: auto; display: block; }

/* ════════════════════════════════
   LOGIN
════════════════════════════════ */
#login-screen {
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg0);
  position: relative; overflow: hidden;
}
#login-screen::before {
  content: '';
  position: absolute; top: -30%; left: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(ellipse, rgba(26,111,181,.12) 0%, transparent 70%);
  pointer-events: none;
}
.login-card {
  position: relative; z-index: 1;
  width: 380px; max-width: 92vw;
  padding: 48px 40px 40px;
  background: var(--bg1);
  border: 1px solid var(--bd);
  border-radius: 16px;
}
.login-logo { margin-bottom: 32px; }
.login-divider {
  height: 1px; background: var(--bd);
  margin: 28px 0;
}
.login-title { font-size: 20px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--tx2); margin-bottom: 28px; }
.g-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 20px;
  background: var(--tx); color: #1a1a1a;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 500; letter-spacing: -.1px;
  cursor: pointer; transition: opacity .15s;
}
.g-btn:hover { opacity: .9; }
.g-btn img { width: 18px; height: 18px; }

/* ════════════════════════════════
   REGISTER / PENDING
════════════════════════════════ */
.center-screen {
  min-height: 100dvh; display: none;
  align-items: center; justify-content: center;
  background: var(--bg0);
}
.center-card {
  width: 400px; max-width: 92vw;
  padding: 48px 40px;
  background: var(--bg1);
  border: 1px solid var(--bd);
  border-radius: 16px;
  text-align: center;
}
.status-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--bg2); border: 1px solid var(--bd2);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin: 0 auto 20px;
}
.center-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.center-sub { font-size: 13px; color: var(--tx2); line-height: 1.7; margin-bottom: 20px; }
.email-badge {
  display: inline-block;
  background: var(--bg2); border: 1px solid var(--bd2);
  border-radius: 6px; padding: 6px 14px;
  font-size: 12px; color: var(--ac2);
  font-family: 'SF Mono', 'Fira Code', monospace;
  margin-bottom: 24px; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.input-field {
  width: 100%; padding: 12px 16px;
  background: var(--bg0); border: 1px solid var(--bd2);
  border-radius: 10px; color: var(--tx);
  font-size: 14px; font-family: inherit;
  outline: none; transition: border-color .15s;
  margin-bottom: 14px;
}
.input-field:focus { border-color: var(--ac2); }
.input-field::placeholder { color: var(--tx3); }
.btn-primary {
  width: 100%; padding: 13px;
  background: var(--tx); color: #0a1628;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  margin-bottom: 10px;
}
.btn-primary:hover { opacity: .9; }
.btn-ghost {
  width: 100%; padding: 11px;
  background: transparent; color: var(--tx3);
  border: 1px solid var(--bd); border-radius: 10px;
  font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.btn-ghost:hover { color: var(--tx2); border-color: var(--bd2); }

/* ════════════════════════════════
   APP SHELL
════════════════════════════════ */
#app-screen { display: none; }

/* Sidebar */
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--nav-w);
  background: var(--bg1);
  border-right: 1px solid var(--bd);
  display: flex; flex-direction: column;
  z-index: 200; transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.sb-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.sb-logo { flex: 1; }
.sb-logo svg { width: 72px; height: auto; }
.sb-nav {
  flex: 1; overflow-y: auto; padding: 8px 0;
  scrollbar-width: none;
}
.sb-nav::-webkit-scrollbar { display: none; }

.nav-section-label {
  padding: 12px 16px 4px;
  font-size: 10px; font-weight: 600;
  color: var(--tx3); text-transform: uppercase; letter-spacing: 1.2px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; margin: 1px 8px;
  border-radius: 8px; cursor: pointer;
  font-size: 13.5px; font-weight: 400; color: var(--tx2);
  transition: all .15s; user-select: none;
}
.nav-item:hover { background: var(--bg3); color: var(--tx); }
.nav-item.active {
  background: rgba(26,111,181,.2);
  color: #60b3f4;
  font-weight: 500;
}
.nav-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  opacity: .7;
}
.nav-item.active .nav-icon { opacity: 1; }

/* Sub nav */
.nav-sub .nav-item {
  padding: 8px 12px 8px 20px;
  font-size: 13px; margin: 0 8px 1px;
}

/* Sidebar bottom */
.sb-bottom {
  padding: 12px; border-top: 1px solid var(--bd); flex-shrink: 0;
}
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg2); margin-bottom: 8px;
}
.user-av {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ac); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  overflow: hidden;
}
.user-av img { width: 100%; height: 100%; object-fit: cover; }
.user-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--tx3); white-space: nowrap; }
.btn-out {
  width: 100%; padding: 8px;
  background: transparent; color: var(--tx3);
  border: 1px solid var(--bd); border-radius: 7px;
  font-size: 12px; cursor: pointer; transition: all .15s;
}
.btn-out:hover { color: #f87171; border-color: #7f1d1d; }

/* Main content */
.main {
  margin-left: var(--nav-w);
  min-height: 100dvh;
  display: flex; flex-direction: column;
}
.topbar {
  height: var(--top-h); flex-shrink: 0;
  background: var(--bg0);
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-menu { display: none; background: none; border: none; color: var(--tx2); cursor: pointer; padding: 4px; }
.topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
.topbar-tag {
  font-size: 11px; color: var(--tx3);
  background: var(--bg2); border: 1px solid var(--bd);
  border-radius: 4px; padding: 3px 8px;
}

.page { flex: 1; padding: 28px 24px; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
.page-header p { font-size: 13px; color: var(--tx2); margin-top: 4px; }

/* Home grid */
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.home-card {
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-radius: 12px; padding: 20px 18px;
  cursor: pointer; transition: all .18s;
  text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 10px;
}
.home-card:hover {
  background: var(--bg3);
  border-color: var(--bd2);
  transform: translateY(-1px);
}
.home-card-icon {
  width: 36px; height: 36px; border-radius: 9px;
  background: rgba(26,111,181,.15);
  display: flex; align-items: center; justify-content: center;
}
.home-card-icon svg { width: 18px; height: 18px; }
.home-card-title { font-size: 13.5px; font-weight: 600; }
.home-card-desc { font-size: 12px; color: var(--tx3); }

/* Placeholder */
.wip {
  background: var(--bg1); border: 1px solid var(--bd);
  border-radius: 12px; padding: 60px 24px;
  text-align: center; color: var(--tx3);
}
.wip-title { font-size: 15px; font-weight: 500; color: var(--tx2); margin: 12px 0 6px; }

/* Overlay */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 199; backdrop-filter: blur(2px);
}

/* Loading */
.loading {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; height: 160px; color: var(--tx3); font-size: 13px;
}
.spin {
  width: 16px; height: 16px;
  border: 2px solid var(--bd2); border-top-color: var(--ac2);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Mobile */
@media (max-width: 768px) {
  :root { --nav-w: 220px; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,.5); }
  .overlay.show { display: block; }
  .main { margin-left: 0; }
  .topbar-menu { display: flex; align-items: center; }
  .page { padding: 20px 16px; }
  .home-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .home-card { padding: 16px 14px; }
}

/* ════════════════════════════════
   COURSE PAGE
════════════════════════════════ */
.course-page { display:flex; flex-direction:column; height:calc(100dvh - var(--top-h)); overflow:hidden; padding:0; }

/* toolbar 兩列 */
.course-toolbar {
  display:flex; flex-direction:column;
  gap:6px; padding:9px 14px 8px; flex-shrink:0;
  border-bottom:1px solid var(--bd);
}
.toolbar-row { display:flex; align-items:center; gap:4px; }
.toolbar-lbl { font-size:10px; color:var(--tx3); white-space:nowrap; margin-right:2px; letter-spacing:.5px; }

/* 地區 Tab — 明顯一些 */
.c-tab {
  padding:5px 12px; border-radius:6px;
  border:1px solid var(--bd); background:var(--bg2);
  color:var(--tx2); font-size:12.5px; font-weight:500; cursor:pointer;
  transition:all .15s; font-family:inherit; white-space:nowrap;
}
.c-tab:hover { background:var(--bg3); color:var(--tx); }
.c-tab.active { background:rgba(26,111,181,.3); color:#60b3f4; border-color:var(--ac); font-weight:600; }

/* 欄位 View — 小 chip 風格 */
.c-view {
  padding:3px 9px; border-radius:10px;
  border:1px solid transparent; background:transparent;
  color:var(--tx3); font-size:11.5px; cursor:pointer;
  transition:all .15s; font-family:inherit; white-space:nowrap;
}
.c-view:hover { background:var(--bg2); color:var(--tx2); border-color:var(--bd); }
.c-view.active { background:var(--bg3); color:var(--tx); border-color:var(--bd2); }
.c-refresh { padding:3px 8px; font-size:13px; line-height:1; margin-left:auto; }

.course-body { flex:1; overflow:auto; font-size:12px; }

/* 表頭列 — Grid，sticky top，grid-template-columns 由 JS inline 設定 */
.c-hdr-row {
  display:grid; position:-webkit-sticky; position:sticky; top:0; z-index:5;
  width:max-content; min-width:100%;
  background:var(--bg1); border-bottom:2px solid var(--bd2);
}
.c-hdr {
  padding:5px 5px;
  font-size:10.5px; font-weight:600; color:var(--tx3);
  white-space:nowrap; overflow:hidden;
  display:flex; align-items:center;
}

/* 分隔列 — 直接子元素，sticky left，iOS Safari 才可靠 */
.c-sep {
  position:-webkit-sticky; position:sticky; left:0; z-index:3;
  width:100%;
  background:#0d2240;
  color:var(--tx); font-weight:700; font-size:12px;
  padding:7px 14px;
  border-top:2px solid var(--ac); border-bottom:1px solid var(--bd2);
}

/* 標籤列 — 直接子元素，sticky left */
.c-label {
  position:-webkit-sticky; position:sticky; left:0; z-index:3;
  width:100%;
  background:#000e20; padding:4px 12px 3px;
  border-top:1px solid var(--bd);
}
.c-label.s-blue   { border-left:3px solid #2a7fc0; }
.c-label.s-brown  { border-left:3px solid #8b6050; }
.c-label.s-orange { border-left:3px solid #c47a3a; }
.c-order { font-size:10px; color:var(--tx3); font-family:monospace; margin-right:7px; }
.c-name  { font-size:12px; font-weight:500; color:var(--tx2); }

/* 資料列 — Grid，grid-template-columns 由 JS inline 設定（與表頭一致）*/
.c-data-row { display:grid; width:max-content; min-width:100%; }
.c-cell {
  padding:5px 7px; white-space:nowrap; overflow:hidden;
  border-bottom:1px solid var(--bd); background:var(--bg0); color:var(--tx);
  display:flex; align-items:center; justify-content:center;
}
.c-cell.c-left { justify-content:flex-start; }

.lv-lo { color:#e8c44a !important; font-weight:600; }
.lv-hi { color:#e87d2a !important; font-weight:600; }
.td-board { color:#36c4c4 !important; }
.td-incl  { color:#f0f060 !important; }
.td-spec  { color:#f0f060 !important; font-weight:600; }
</style>
</head>

      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      以 Google 帳號繼續
    </button>
  </div>
</div>

<!-- ② 填寫姓名 -->
<div id="register-screen" class="center-screen">
  <div class="center-card">
    <div class="status-icon">👋</div>
    <div class="center-title">填寫您的姓名</div>
    <div class="center-sub">請填寫姓名或暱稱，讓管理員確認身份後核准帳號。</div>
    <div class="email-badge" id="reg-email"></div>
    <input id="reg-name" class="input-field" type="text" placeholder="姓名 / 暱稱" autocomplete="name">
    <button class="btn-primary" onclick="submitRegister()">送出申請</button>
    <button class="btn-ghost" onclick="signOut()">取消</button>
  </div>
</div>

<!-- ③ 待審核 -->
<div id="pending-screen" class="center-screen">
  <div class="center-card">
    <div class="status-icon">⏳</div>
    <div class="center-title">帳號審核中</div>
    <div class="center-sub">申請已送出，管理員核准後即可登入。</div>
    <div class="email-badge" id="pend-email"></div>
    <button class="btn-ghost" onclick="signOut()">登出</button>
  </div>
</div>

<!-- ④ 主畫面 -->
<div id="app-screen">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 150">
          <path fill="#fff" d="M202,79.77H178v8.85H202q6.09,0,6.09-4.43V84Q208.11,79.78,202,79.77Z"/>

function svgIcon(path) {

/* ── 登入 ── */
function signIn() {
  // 登入時才初始化 GSI（只在 login screen 呼叫）
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false });
  google.accounts.id.prompt(n => {
    if (n.isNotDisplayed() || n.isSkippedMoment()) {
      const btn = document.querySelector('.g-btn');
      if (btn) google.accounts.id.renderButton(btn.parentNode, { theme: 'outline', size: 'large' });
    }
  });
}

function onCredential(resp) {
  idToken = resp.credential;
  if (currentUser) {
    // 靜默刷新 token 成功 → 存好、如果課程頁在等待就立刻重試
    needsTokenRefresh = false;
    _saveSess(currentUser, idToken);
    const cb = document.getElementById('course-body');
    if (cb && cb.dataset.waiting === '1') {
      cb.dataset.waiting = '';
      loadCourse();
    }
    return;
  }
  needsTokenRefresh = false;
  callAPI({token: idToken, action: 'check'});
}

async function callAPI(params) {
  try {
    const qs  = new URLSearchParams(params);
    const res = await fetch(`${API}?${qs}`, { redirect: 'follow' });
    handleResult(await res.json());
  } catch(e) { alert('連線失敗，請稍後再試'); }
}

function handleResult(d) {
  hide('login-screen'); hide('register-screen'); hide('pending-screen'); hide('app-screen');
  if (d.status === 'approved') {
    currentUser = d;
    _saveSess(d, idToken);
    showApp();
  }
  else if (d.status === 'new_user') { showRegister(d.email); }
  else if (d.status === 'pending')  { showPending(d.email); }
  else if (d.status === 'disabled') { alert('此帳號已停用，請聯絡管理員。'); show('login-screen', 'flex'); }
  else { alert('錯誤：' + (d.message||'請重試')); show('login-screen', 'flex'); }
}

function showRegister(email) {
  show('register-screen', 'flex');
  document.getElementById('reg-email').textContent = email;
}
async function submitRegister() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { alert('請填寫姓名'); return; }
  await callAPI({ token: idToken, name, action: 'register' });
}

function showPending(email) {
  show('pending-screen', 'flex');
  document.getElementById('pend-email').textContent = email;
}

function showApp() {
  show('app-screen');

function buildNav(pages) {
  const menu = document.getElementById('nav-menu');
  let html = `<div class="nav-item active" id="nav-home" onclick="showHome()">

    首頁</div>`;

  const secs = {};
  pages.forEach(p => {
    const s = PAGES[p]?.section || '其他';
    if (!secs[s]) secs[s] = [];
    secs[s].push(p);
  });

  Object.entries(secs).forEach(([sec, ps]) => {
    html += `<div class="nav-section-label">${sec}</div>`;
    ps.forEach(p => {
      const def = PAGES[p] || {};
      const id  = 'n-' + p.replace(/[^a-z0-9]/gi, '-');
      html += `<div class="nav-item" id="${id}" onclick="go('${p}')">${svgIcon(def.icon||'')} ${p}</div>`;

  menu.innerHTML = html;

function go(page) {
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  const el = document.getElementById('n-' + page.replace(/[^a-z0-9]/gi, '-'));

  const pc = document.getElementById('page-content');

/* ── Session helpers ── */
const _SK = 'dbc_u2', _TK = 'dbc_t2', _TSK = 'dbc_ts2';
const _TOKEN_FRESH = 55 * 60 * 1000; // token 55 分鐘內視為有效

function _saveSess(u, t) {
  try { localStorage.setItem(_SK, JSON.stringify(u)); localStorage.setItem(_TK, t); localStorage.setItem(_TSK, String(Date.now())); } catch(e) {}
}
function _loadSess() {
  try {
    const u = JSON.parse(localStorage.getItem(_SK) || 'null');
    const t = localStorage.getItem(_TK) || '';
    if (u?.status === 'approved' && t) return { user: u, token: t };
  } catch(e) {}
  return null;
}
function _isTokenFresh() {
  try { return Date.now() - parseInt(localStorage.getItem(_TSK) || '0') < _TOKEN_FRESH; } catch(e) { return false; }
}
function _clearSess() {
  try { [_SK, _TK, _TSK].forEach(k => localStorage.removeItem(k)); } catch(e) {}
}

window.onload = () => {
  /* Service Worker */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

  /* 有快取 session → 直接顯示 app，完全不初始化 GSI（避免觸發 FedCM 提示）*/
  const sess = _loadSess();
  if (sess) {
    currentUser       = sess.user;
    idToken           = sess.token;
    hide('login-screen');
    showApp();
    // 不呼叫 initialize() / prompt()，不會有任何 Google 登入提示
  } else {
    show('login-screen', 'flex');
    // 沒有 session 才初始化 GSI + 顯示登入
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true });
    google.accounts.id.prompt();
  }
};

let cRawRows = null;

function cIsSep(row) {
  return Array.isArray(row) && row.length >= 3 && WEEKDAY_SET.has(String(row[2]));
}

function cFilter(rows, area) {
  if (area === '全部') return rows.filter(r => r && !cIsSep(r) && !r.every(c => !c));
  return rows.filter(row => {
    if (!row || cIsSep(row) || row.every(c => !c)) return false;
    const i1 = String(row[CI['項目1']] ?? '');
    if (area === '斑尾') return i1.includes('斑尾');
    if (area === '龍平') return i1.includes('龍平');
    if (area === '湯澤') return i1 === '湯澤純課';
    return !i1.includes('斑尾') && !i1.includes('龍平') && i1 !== '湯澤純課';
  });
}

function cHotelRank(v) {
  if (!v) return 997;
  for (let i = 0; i < HOTEL_ORDER.length; i++) if (v.includes(HOTEL_ORDER[i])) return i;
  return v.includes('野澤') ? 998 : 997;
}

function cSort(rows, area) {
  const copy = [...rows];
  if (area === '全部') return copy; // 全部：保持原始順序
  if (area !== '野澤') {
    return copy.sort((a,b) => String(a[CI['訂編']]??'').localeCompare(String(b[CI['訂編']]??'')));
  }
  return copy.sort((a,b) => {
    const hr = cHotelRank(String(a[CI['項目']]??'')) - cHotelRank(String(b[CI['項目']]??''));
    if (hr) return hr;
    const pr = (parseInt(a[CI['配房序']])||0) - (parseInt(b[CI['配房序']])||0);
    if (pr) return pr;
    return String(a[CI['訂編']]??'').localeCompare(String(b[CI['訂編']]??''));
  });
}

function cAreaColor(i1) {
  if (i1.includes('斑尾')) return 's-blue';
  if (i1.includes('龍平')) return 's-brown';
  if (i1 === '湯澤純課')   return 's-orange';

}

    <div class="course-toolbar">
      <div class="toolbar-row">
        <span class="toolbar-lbl">地區</span>
        <div class="course-tabs">
          ${areas.map(a => `<button class="c-tab${a===cArea?' active':''}" data-area="${a}" onclick="switchCArea('${a}')">${a}</button>`).join('')}
        </div>
      </div>
      <div class="toolbar-row">
        <span class="toolbar-lbl">欄位</span>
        <div class="course-views">
          ${Object.keys(COURSE_VCOLS).map(v => `<button class="c-view${v===cView?' active':''}" data-view="${v}" onclick="switchCView('${v}')">${v}</button>`).join('')}
        </div>
        <button class="c-view c-refresh" onclick="refreshCourse()" title="重新載入">↺</button>
      </div>
    </div>
    <div class="course-body" id="course-body">
      <div class="loading"><div class="spin"></div> 載入中</div>
    </div>`;
  if (cRawRows) renderCTable();
  else loadCourse();
}

async function loadCourse() {
  /* 先用快取立即顯示 */
  try {
    const cached = localStorage.getItem(COURSE_CACHE_KEY);
    const ts = parseInt(localStorage.getItem(COURSE_CACHE_KEY + '_ts') || '0');
    if (cached && Date.now() - ts < COURSE_CACHE_TTL) {
      cRawRows = JSON.parse(cached);
      renderCTable();
      return;
    }
  } catch(e) {}
  /* 直接嘗試抓取，token 過期時顯示重新登入按鈕 */
  try {
    const res  = await fetch(`${API}?token=${encodeURIComponent(idToken)}&action=getCourse`, {redirect:'follow'});
    const data = await res.json();
    if (data.status !== 'ok') {
      if (data.message?.includes('Token') || data.message?.includes('未授權')) {
        const body = document.getElementById('course-body');
        if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3);line-height:2.4">
          登入已過期<br>
          <button onclick="signOut()" style="margin-top:8px;padding:8px 22px;background:var(--ac);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">重新登入</button>
        </div>`;
        return;
      }
      throw new Error(data.message || '伺服器錯誤');
    }
    cRawRows = data.rows || [];
    try {
      localStorage.setItem(COURSE_CACHE_KEY, JSON.stringify(cRawRows));
      localStorage.setItem(COURSE_CACHE_KEY + '_ts', String(Date.now()));
    } catch(e) {}
    renderCTable();
  } catch(e) {
    /* 抓取失敗仍嘗試顯示舊快取 */
    try {
      const stale = localStorage.getItem(COURSE_CACHE_KEY);
      if (stale) { cRawRows = JSON.parse(stale); renderCTable(); return; }
    } catch(e2) {}
    const body = document.getElementById('course-body');
    if (body) body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--tx3)">載入失敗：${e.message}</div>`;
  }
}

async function refreshCourse() {
  cRawRows = null;
  try { localStorage.removeItem(COURSE_CACHE_KEY); localStorage.removeItem(COURSE_CACHE_KEY + '_ts'); } catch(e) {}
  const body = document.getElementById('course-body');
  if (body) body.innerHTML = '<div class="loading"><div class="spin"></div> 載入中</div>';
  await loadCourse();
}

function switchCArea(area) {
  cArea = area;
  document.querySelectorAll('.c-tab').forEach(b => b.classList.toggle('active', b.dataset.area === area));
  renderCTable();
}

function switchCView(view) {
  cView = view;
  document.querySelectorAll('.c-view[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderCTable();
}

function renderCTable() {
  const body = document.getElementById('course-body');
  if (!body || !cRawRows) return;

  const colIdxs = COURSE_VCOLS[cView];

  /* 建立日期分組 */
  const groups = [];
  let cur = null;
  for (const row of cRawRows) {
    if (!Array.isArray(row) || row.every(c => !c)) continue;
    if (String(row[0]) === '編號') continue;
    if (cIsSep(row)) { cur = {sep: row, rows: []}; groups.push(cur); }
    else if (cur) cur.rows.push(row);
  }

  /* 表頭列 + 資料列共用相同的 grid-template-columns → 欄寬完全對齊 */
  const gridCols = colIdxs.map(ci => C_META[ci][1] + 'px').join(' ');
  let html = `<div class="c-hdr-row" style="grid-template-columns:${gridCols}">`;
  colIdxs.forEach(ci => {
    const [name, , align] = C_META[ci];
    html += `<div class="c-hdr" style="justify-content:${align==='left'?'flex-start':'center'}">${name}</div>`;
  });
  html += '</div>';

  let total = 0;
  for (const grp of groups) {
    const filtered = cFilter(grp.rows, cArea);
    const sorted   = cSort(filtered, cArea);
    if (!sorted.length) continue;
    total += sorted.length;

    /* 分隔列（直接子元素，sticky left） */
    const dateStr = String(grp.sep[1] ?? '');
    const wday    = String(grp.sep[2] ?? '');
    const counts  = cArea === '全部'
      ? [grp.sep[3],grp.sep[4],grp.sep[5],grp.sep[6]].filter(Boolean).join(' | ')
      : `${cArea} ${sorted.length}人`;
    html += `<div class="c-sep">${dateStr}（${wday}） &nbsp; ${counts}</div>`;

    /* 每個旅客：標籤列（直接子元素，sticky left）+ 資料列（flex row） */
    for (const row of sorted) {
      const orderNo = String(row[CI['訂編']]     ?? '');
      const name    = String(row[CI['中文姓名']] ?? '');
      const i1      = String(row[CI['項目1']]    ?? '');
      const sc      = cAreaColor(i1);

      html += `<div class="c-label${sc?' '+sc:''}"><span class="c-order">${orderNo}</span><span class="c-name">${name}</span></div>`;
      html += `<div class="c-data-row" style="grid-template-columns:${gridCols}">`;
      colIdxs.forEach(ci => {
        const val = String(row[ci] ?? '');
        const [, , align] = C_META[ci];
        let cls = 'c-cell' + (align === 'left' ? ' c-left' : '');
        if (ci === CI['Lv']) {
          const lv = val.toLowerCase();
          if (lv==='lv1'||lv==='lv2') cls += ' lv-lo';
          else if (lv==='lv3'||lv==='lv4'||lv==='lv5') cls += ' lv-hi';
        }
        if (ci===CI['類別'] && val==='雙板') cls += ' td-board';
        if (ci===CI['天數'] && val.includes('含')) cls += ' td-incl';
        if (ci===CI['註記'] && val==='專屬')  cls += ' td-spec';
        html += `<div class="${cls}">${val}</div>`;
      });
      html += '</div>';
    }
  }

  if (!total) html += `<div class="c-label" style="padding:32px;color:var(--tx3)">此期間無資料</div>`;
  body.innerHTML = html;
}
</script>
</body>
</html>
